function getThemeColors() {
  const styles = getComputedStyle(document.body);
  const get = (v, fallback) => (styles.getPropertyValue(v).trim() || fallback);
  return {
    blue: get('--blue', '#5c6ac4'),
    green: get('--green', '#008060'),
    violet: get('--violet', '#9c6ade'),
    danger: get('--danger', '#d72c0d'),
    border: get('--border', '#e3e4e6'),
    textDim: get('--text-dim', '#6d7175'),
    textFaint: get('--text-faint', '#9a9ea1')
  };
}


function previousPeriodDates() {
  if (statsPeriod === 'woche') {
    // Vorperiode = das vorherige Abrechnungs-Schreibfenster
    const offset = (currentPage === 'dashboard' ? zeitraumOffset : 0) + 1;
    const prevWin = windowOffsetBack(offset);
    return daysInRange(prevWin.schreibStart, prevWin.schreibEnd);
  }
  if (statsPeriod === 'monat') {
    const offset = (currentPage === 'dashboard' ? monatOffset : 0) + 1;
    const now = new Date();
    const prevMonth = new Date(now.getFullYear(), now.getMonth() - offset, 1);
    const month = prevMonth.getMonth();
    const arr = [];
    let d = new Date(prevMonth);
    while (d.getMonth() === month) {
      arr.push(todayKey(d));
      d.setDate(d.getDate() + 1);
    }
    return arr;
  }
  // 'gesamt' = ausgewähltes Jahr -> Vorperiode ist das Jahr davor
  const year = new Date().getFullYear() - (currentPage === 'dashboard' ? jahrOffset : 0) - 1;
  return Object.keys(data).filter(k => k.startsWith(String(year))).sort();
}

// Auszahlungs-Rhythmus: 1.-15. geschrieben -> Auszahlung 20.-25. im selben Monat
//                        16.-Monatsende geschrieben -> Auszahlung 7.-12. im Folgemonat
function payoutWindowOf(key) {
  const d = new Date(key + 'T00:00:00');
  const year = d.getFullYear(), month = d.getMonth(), day = d.getDate();
  if (day <= 15) {
    return {
      id: `${year}-${String(month + 1).padStart(2, '0')}-A`,
      schreibStart: new Date(year, month, 1),
      schreibEnd: new Date(year, month, 15),
      auszahlStart: new Date(year, month, 20),
      auszahlEnd: new Date(year, month, 25),
    };
  }
  const lastDay = new Date(year, month + 1, 0).getDate();
  const payoutBase = new Date(year, month + 1, 1);
  return {
    id: `${year}-${String(month + 1).padStart(2, '0')}-B`,
    schreibStart: new Date(year, month, 16),
    schreibEnd: new Date(year, month, lastDay),
    auszahlStart: new Date(payoutBase.getFullYear(), payoutBase.getMonth(), 7),
    auszahlEnd: new Date(payoutBase.getFullYear(), payoutBase.getMonth(), 12),
  };
}

function payoutStatus(win) {
  const now = new Date();
  if (now <= win.schreibEnd) return 'offen';
  if (now < win.auszahlStart) return 'erwartet';
  if (now <= win.auszahlEnd) return 'faellig';
  return 'ueberfaellig';
}

const PAYOUT_STATUS_LABELS = {
  offen: { text: 'Läuft noch', color: 'var(--text-dim)' },
  erwartet: { text: 'Auszahlung erwartet', color: 'var(--blue)' },
  faellig: { text: 'Jetzt fällig', color: 'var(--green)' },
  ueberfaellig: { text: 'Fenster vorbei', color: 'var(--danger)' },
};

function fmtWindowRange(start, end) {
  const monthFmt = (d) => d.toLocaleDateString('de-DE', { month: 'short' });
  if (start.getMonth() === end.getMonth()) {
    return `${start.getDate()}.–${end.getDate()}. ${monthFmt(end)}`;
  }
  return `${start.getDate()}. ${monthFmt(start)} – ${end.getDate()}. ${monthFmt(end)}`;
}

function buildPayoutWindows(daysBack = 70, limit = 4) {
  const now = new Date();
  const map = {};
  for (let i = 0; i < daysBack; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const key = todayKey(d);
    const win = payoutWindowOf(key);
    if (!map[win.id]) map[win.id] = Object.assign({ brutto: 0, count: 0 }, win);
    const e = data[key];
    if (e) {
      map[win.id].brutto += dayTotal(e);
      map[win.id].count += (e.neu || 0) + (e.bestand || 0);
    }
  }
  return Object.values(map)
    .sort((a, b) => b.schreibStart - a.schreibStart)
    .slice(0, limit);
}

function monthlyHistoryData(months = 6) {
  const now = new Date();
  const result = [];
  for (let i = months - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const monthIdx = d.getMonth();
    const year = d.getFullYear();
    let total = 0, neu = 0, bestand = 0, storno = 0;
    let cur = new Date(year, monthIdx, 1);
    while (cur.getMonth() === monthIdx) {
      const key = todayKey(cur);
      const e = data[key];
      if (e) {
        total += dayTotal(e);
        neu += e.neu || 0;
        bestand += e.bestand || 0;
        storno += (e.storno_neu || 0) + (e.storno_bestand || 0);
      }
      cur.setDate(cur.getDate() + 1);
    }
    const label = d.toLocaleDateString('de-DE', { month: 'short', year: '2-digit' });
    const isCurrent = i === 0;
    result.push({ label, total, neu, bestand, storno, isCurrent });
  }
  return result;
}

// Wie monthlyHistoryData, aber auf Basis bestätigter Abrechnungen (über deren windowId
// dem jeweiligen Monat zugeordnet) statt getrackter Tageswerte - für die Ausgezahlt-Ansicht.
function monthlySettlementData(months = 6) {
  const now = new Date();
  const result = [];
  for (let i = months - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const monthKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const total = settlements
      .filter(s => s.windowId && s.windowId.startsWith(monthKey))
      .reduce((sum, s) => sum + (s.betrag || 0), 0);
    const label = d.toLocaleDateString('de-DE', { month: 'short', year: '2-digit' });
    result.push({ label, total, isCurrent: i === 0 });
  }
  return result;
}

function buildDonutChartSVG(segments, opts) {
  const o = Object.assign({ size: 200, strokeWidth: 24, track: 'var(--border)' }, opts || {});
  const r = (o.size - o.strokeWidth) / 2;
  const cx = o.size / 2, cy = o.size / 2;
  const circumference = 2 * Math.PI * r;
  const total = segments.reduce((a, s) => a + s.value, 0);
  let offsetAcc = 0;
  const gap = total > 0 ? Math.min(3, circumference * 0.01) : 0;
  const arcs = segments.filter(s => s.value > 0).map(s => {
    const frac = s.value / total;
    const len = Math.max(0, frac * circumference - gap);
    const dasharray = `${len.toFixed(2)} ${(circumference - len).toFixed(2)}`;
    const dashoffset = (-offsetAcc).toFixed(2);
    offsetAcc += frac * circumference;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${o.strokeWidth}" stroke-dasharray="${dasharray}" stroke-dashoffset="${dashoffset}" stroke-linecap="round" class="donut-arc"/>`;
  }).join('');
  return `
    <svg viewBox="0 0 ${o.size} ${o.size}" width="${o.size}" height="${o.size}" class="donut-svg">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${o.track}" stroke-width="${o.strokeWidth}"/>
      <g transform="rotate(-90 ${cx} ${cy})">${arcs}</g>
    </svg>`;
}

function renderDashboardContent(b, animate) {
  const colors = getThemeColors();
  const periodLabel = statsPeriod === 'woche' ? 'diesen Abrechnungszeitraum' : statsPeriod === 'monat' ? 'diesen Monat' : 'dieses Jahr';

  // Brutto/Ausgezahlt-Umschalter - bestimmt ab hier, welche Zahlen Kundenmix, Umsatz-Mix,
  // Kennzahlen und Monats-Performance anzeigen (getrackte Schätzung vs. bestätigte Abrechnungen).
  const periodSettlements = settlementsInSelectedPeriod();
  const agg = settlementsAggregate(periodSettlements);
  const isAusgezahltView = dashboardView === 'ausgezahlt';
  const viewNeuCount = isAusgezahltView ? agg.neu : b.neuCount;
  const viewBestandCount = isAusgezahltView ? agg.bestand : b.bestandCount;
  const viewStornoCount = isAusgezahltView ? agg.storno : b.stornoCount;
  const kundenmixNoData = isAusgezahltView && !agg.hasSplit;

  // Abrechnungen melden Neukunden/Bestand als Bruttomenge (Stornos sind darin bereits enthalten),
  // daher müssen Stornos hier abgezogen werden, damit "X Kunden" zur bestätigten Aufträge-Zahl
  // passt (so wie es schon bei "Aufträge" / settleAuftraegeTotal gemacht wird).
  const grossCustomers = viewNeuCount + viewBestandCount;
  const totalCustomers = isAusgezahltView ? Math.max(0, grossCustomers - viewStornoCount) : grossCustomers;
  const neuPct = totalCustomers > 0 ? Math.min(100, Math.round((viewNeuCount / totalCustomers) * 100)) : 0;
  const bestandPct = totalCustomers > 0 ? Math.max(0, 100 - neuPct) : 0;
  const stornoShare = grossCustomers > 0 ? fmtPct((viewStornoCount / grossCustomers) * 100) : '0 %';

  // Stornos als roter Abschnitt; in der Ausgezahlt-Ansicht sind sie in Neu/Bestand schon enthalten
  const donutStorno = Math.min(viewStornoCount, isAusgezahltView ? grossCustomers : Infinity);
  const donutScale = isAusgezahltView && grossCustomers > 0 ? Math.max(0, grossCustomers - donutStorno) / grossCustomers : 1;
  const donutSvg = buildDonutChartSVG([
    { label: 'Neukunden', value: viewNeuCount * donutScale, color: colors.blue },
    { label: 'Bestandskunden', value: viewBestandCount * donutScale, color: colors.green },
    { label: 'Stornos', value: donutStorno, color: colors.danger }
  ], { size: 200, strokeWidth: 24 });

  const dominant = viewNeuCount >= viewBestandCount
    ? { label: 'Neukunden', pct: neuPct }
    : { label: 'Bestandskunden', pct: bestandPct };
  const donutCenterLabel = totalCustomers > 0 ? dominant.label : 'Keine Daten';
  const donutCenterPct = totalCustomers > 0 ? dominant.pct + '%' : '–';

  const kundenmixSub = isAusgezahltView
    ? (kundenmixNoData ? 'Keine Aufschlüsselung in den Abrechnungen hinterlegt' : `${totalCustomers} bestätigte Kunden (alle Abrechnungen)`)
    : `${totalCustomers} Kunden ${periodLabel}`;

  // Auftrags-Mix nach Anzahl (nicht €) für die Ausgezahlt-Ansicht, da Abrechnungen
  // keinen Umsatz-Split pro Typ liefern, nur Stückzahlen.
  const ausgezahltMixData = (() => {
    if (totalCustomers === 0) return [];
    return [
      { label: 'Neukunden', pct: neuPct, color: colors.blue },
      { label: 'Bestandskunden', pct: bestandPct, color: colors.green },
    ];
  })();
  const umsatzMixTitle = isAusgezahltView ? 'Auftrags-Mix (bestätigt)' : 'Umsatz-Mix';

  let trendBadge = '';
  const prevDates = previousPeriodDates();
  if (prevDates) {
    const prevTotal = prevDates.reduce((sum, k) => sum + dayTotal(data[k]), 0);
    if (prevTotal > 0) {
      const diff = Math.round(((b.periodTotal - prevTotal) / prevTotal) * 100);
      const up = diff >= 0;
      trendBadge = `<span class="dash-badge ${up ? 'up' : 'down'}">${up ? '+' : ''}${diff}% vs. Vorperiode</span>`;
    }
  }

  const revBarsHtml = (isAusgezahltView ? ausgezahltMixData : b.bd).map(c => `
    <div class="dash-bar-row">
      <div class="dash-bar-top">
        <span><span class="legend-dot" style="background:${c.color}"></span>${c.label}</span>
        <span>${c.pct}%</span>
      </div>
      <div class="dash-bar-track"><div class="dash-bar-fill" style="width:${c.pct}%; background:${c.color};"></div></div>
    </div>`).join('');

  const daysWithEntries = [...b.periodDates].filter(k => data[k] && dayTotal(data[k]) > 0);
  const top5 = daysWithEntries.sort((a, c) => dayTotal(data[c]) - dayTotal(data[a])).slice(0, 5);
  const top5Html = top5.length ? top5.map(k => {
    const e = data[k];
    return `
      <div class="dash-list-row">
        <div class="dash-avatar" style="background:${colors.blue}22; color:${colors.blue};">${fmtDateShort(k).slice(0, 5)}</div>
        <div class="dash-list-info">
          <div class="dash-list-name">${fmtDateLabel(k)}</div>

        </div>

  }).join('') : `<div class="empty-state">Noch keine Einträge in diesem Zeitraum.</div>`;

  const stornoDays = b.periodDates
    .filter(k => data[k] && ((data[k].storno_neu || 0) + (data[k].storno_bestand || 0)) > 0)
    .sort((a, c) => ((data[c].storno_neu || 0) + (data[c].storno_bestand || 0)) - ((data[a].storno_neu || 0) + (data[a].storno_bestand || 0)))
    .slice(0, 5);
  const stornoHtml = stornoDays.length ? stornoDays.map(k => {

        <div class="dash-avatar" style="background:${colors.danger}22; color:${colors.danger};">${fmtDateShort(k).slice(0, 5)}</div>
        <div class="dash-list-info">
          <div class="dash-list-name">${fmtDateLabel(k)}</div>

      </div>`;
  }).join('') : `<div class="empty-state">Keine Stornos in diesem Zeitraum 🎉</div>`;

  const fixSchwelle = fixkostenSchwelle();
  const fixAufbau = zielAufbau();
  const fixAvgStorno = avgStornoQuote();
  const fixStornoPct = stornoAufschlagPct();

  const settlementWindowOptionsHtml = ['<option value="">– Zeitraum wählen (optional) –</option>'].concat(

// ---------- Reiter "Meine Abrechnungen": Jahresdiagramm + pro Monat ein Block + PDF ----------
let abrYear = new Date().getFullYear();
function shiftAbrYear(d) { abrYear += d; render(); }

const ABR_MONTHS = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const ABR_MONTHS_LONG = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

// Umsatzsteuer: ist der Betrag aus der Abrechnung inkl. 19 %, steckt darin Betrag − Betrag/1,19 (gehört dem Finanzamt)
function abrUst(total) { return settings.ustPflicht ? total - total / 1.19 : 0; }
function abrNet(total) { return nettoOf(total - abrUst(total)); }

function abrYearData(y) {
  return Array.from({ length: 12 }, (_, i) => {
    const mk = `${y}-${String(i + 1).padStart(2, '0')}`;
    const A = settlements.filter(x => x.windowId === mk + '-A');
    const B = settlements.filter(x => x.windowId === mk + '-B');
    const a = A.reduce((t, x) => t + (x.betrag || 0), 0);
    const b = B.reduce((t, x) => t + (x.betrag || 0), 0);
    return { mk, i, hasA: A.length > 0, hasB: B.length > 0, a, b, total: a + b, has: A.length + B.length > 0 };
  });
}

// Auswahl aller Abrechnungen (1. und 2. pro Monat) für die Zuordnung, neueste zuerst
function abrWindowOptions() {
  const now = new Date();
  const out = [];
  for (let y = now.getFullYear(); y >= now.getFullYear() - 3; y--) {
    const lastM = y === now.getFullYear() ? now.getMonth() : 11;
    for (let m = lastM; m >= 0; m--) {
      const mk = `${y}-${String(m + 1).padStart(2, '0')}`;
      const last = new Date(y, m + 1, 0).getDate();
      out.push(`<option value="${mk}-B">${ABR_MONTHS_LONG[m]} ${y} · Abrechnung 2 (16.–${last}.)</option>`);
      out.push(`<option value="${mk}-A">${ABR_MONTHS_LONG[m]} ${y} · Abrechnung 1 (1.–15.)</option>`);
    }
  }
  return out.join('');
}

function assignSettlementWindow(id, windowId) {
  const x = settlements.find(z => String(z.id) === String(id));
  if (!x || !windowId) return;
  x.windowId = windowId;
  saveData();
  render();
}

function abrWindowName(w) {
  const m = /^(\d{4})-(\d{2})-([AB])$/.exec(w);
  return m ? `${ABR_MONTHS_LONG[Number(m[2]) - 1]} ${m[1]} · Abrechnung ${m[3] === 'A' ? 1 : 2}` : '';
}
// Vorschlag für einen Zeitraum aus dem Namen: "Februar Teil 2" oder Datum (Auszahlung 20.–25. = Abrechnung 1, 7.–12. Folgemonat = Abrechnung 2)
function abrSuggestWindow(x) {
  const label = String(x.label || '').toLowerCase();
  const names = ['januar', 'februar', 'märz', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'dezember'];
  const mm = new RegExp('(' + names.join('|') + ')(?:\\s+(\\d{4}))?').exec(label);
  if (mm) {
    const mi = names.indexOf(mm[1]);
    const now = new Date();
    const yr = mm[2] ? Number(mm[2]) : (mi > now.getMonth() ? now.getFullYear() - 1 : now.getFullYear());
    const mk = `${yr}-${String(mi + 1).padStart(2, '0')}`;
    if (/teil\s*2|abrechnung\s*2|\b2\.\s*abrechnung/.test(label)) return mk + '-B';
    if (/teil\s*1|abrechnung\s*1|\b1\.\s*abrechnung/.test(label)) return mk + '-A';
    return '';
  }
  const m = /(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(label);
  if (m) {
    const d = Number(m[1]), mo = Number(m[2]), yr = Number(m[3]);
    if (mo < 1 || mo > 12) return '';
    if (d >= 18) return `${yr}-${String(mo).padStart(2, '0')}-A`;
    const pm = new Date(yr, mo - 2, 1);
    return `${pm.getFullYear()}-${String(pm.getMonth() + 1).padStart(2, '0')}-B`;
  }
  return '';
}
function applyAllSuggestions() {
  settlements.forEach(x => {
    if (x.windowId && /^\d{4}-\d{2}-[AB]$/.test(x.windowId)) return;
    const w = abrSuggestWindow(x);
    if (w) x.windowId = w;
  });
  saveData();
  render();
}

function abrNiceMax(v) {
  if (v <= 0) return 1000;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

function abrChartSvg(data) {
  const WIDE = typeof window !== 'undefined' && window.innerWidth >= 900;
  const W = WIDE ? 1120 : 720, H = WIDE ? 320 : 260, L = 58, R = 24, T = 34, B = 32;
  const iw = W - L - R, ih = H - T - B;
  const max = abrNiceMax(Math.max(0, ...data.map(d => d.total)) * 1.08);
  const x = i => L + (iw * i) / 11;
  const y = v => T + ih - (ih * v) / max;
  const now = new Date();
  const curI = abrYear === now.getFullYear() ? now.getMonth() : -1;
  const best = data.reduce((b, d) => (d.has && (!b || d.total > b.total) ? d : b), null);
  const grid = [0, 1, 2, 3, 4].map(k => {
    const v = (max * k) / 4;
    return `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1" ${k ? 'stroke-dasharray="3 5"' : ''}/><text x="${L - 10}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-dim)">${Math.round(v).toLocaleString('de-DE')}</text>`;
  }).join('');
  const xl = data.map(d => `<text x="${x(d.i)}" y="${H - 10}" text-anchor="middle" font-size="11" font-weight="${d.i === curI ? 700 : 500}" fill="${d.i === curI ? 'var(--blue)' : 'var(--text-dim)'}">${ABR_MONTHS[d.i]}</text>`).join('');
  // Linie mit weichen Kurven (waagerechte Tangenten: kein Überschwingen), pro zusammenhängendem Abschnitt
  const runs = [];
  data.forEach(d => { if (d.has) { const r = runs[runs.length - 1]; if (r && r[r.length - 1].i === d.i - 1) r.push(d); else runs.push([d]); } });
  const curve = (run, fn) => run.map((d, k) => {
    const px = x(d.i), py = y(fn(d));
    if (!k) return `M${px.toFixed(1)} ${py.toFixed(1)}`;
    const q = run[k - 1], qx = x(q.i), qy = y(fn(q)), mx = (qx + px) / 2;
    return `C${mx.toFixed(1)} ${qy.toFixed(1)} ${mx.toFixed(1)} ${py.toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)}`;
  }).join(' ');
  const base = y(0);
  const area = runs.map(r => `<path d="${curve(r, d => d.total)} L${x(r[r.length - 1].i).toFixed(1)} ${base} L${x(r[0].i).toFixed(1)} ${base} Z" fill="url(#abrGrad)"/>`).join('');
  const lineBrutto = runs.map(r => `<path d="${curve(r, d => d.total)}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  const eur = v => Math.round(v).toLocaleString('de-DE') + ' €';
  const dots = data.filter(d => d.has).map(d => {
    const isBest = best && d.i === best.i;
    return `<g><title>${ABR_MONTHS_LONG[d.i]}: ${eur(d.total)}</title>
      <circle cx="${x(d.i)}" cy="${y(d.total)}" r="${isBest ? 6 : 4.5}" fill="var(--card)" stroke="var(--blue)" stroke-width="${isBest ? 3 : 2.5}"/></g>`;
  }).join('');
  const labels = data.filter(d => d.has).map(d => {
    const t = Math.round(d.total).toLocaleString('de-DE');
    const w = t.length * 6.6 + 14, isBest = best && d.i === best.i;
    return `<g><rect x="${x(d.i) - w / 2}" y="${y(d.total) - 31}" width="${w}" height="20" rx="10" fill="${isBest ? 'var(--blue)' : 'var(--card)'}" stroke="${isBest ? 'var(--blue)' : 'var(--border)'}"/><text x="${x(d.i)}" y="${y(d.total) - 17}" text-anchor="middle" font-size="11" font-weight="700" fill="${isBest ? '#fff' : 'var(--text)'}">${t}</text></g>`;
  }).join('');
  const any = data.some(d => d.has);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Verdienst pro Monat" style="display:block;width:100%;height:auto;">
    <defs><linearGradient id="abrGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--blue)" stop-opacity="0.28"/><stop offset="100%" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xl}
    ${any ? `${area}${lineBrutto}${dots}${labels}` : `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="13" fill="var(--text-dim)">Noch keine Abrechnungen in diesem Jahr</text>`}
  </svg>`;
}

function renderAbrechnungenContent() {
  const now = new Date();
  const y = abrYear;
  const data = abrYearData(y);
  const months = data.filter(d => d.has || (y === now.getFullYear() && d.i === now.getMonth()));
  const yearTotal = data.reduce((t, d) => t + d.total, 0);
  const blocks = months.slice().reverse().map(d => {
    const last = new Date(y, d.i + 1, 0).getDate();
    const parts = [
      { nr: 1, range: '1.–15.', has: d.hasA, sum: d.a },
      { nr: 2, range: `16.–${last}.`, has: d.hasB, sum: d.b },
    ];
    const rows = parts.map(p => `
      <div class="abr-row ${p.has ? '' : 'missing'}">
        <div>Abrechnung ${p.nr}<small>geschrieben ${p.range}</small></div>
        <b>${p.has ? fmtEuro(p.sum) : 'noch offen'}</b>
      </div>`).join('');
    return `
      <div class="card dash-card abr-month">
        <div class="dash-card-title">${ABR_MONTHS_LONG[d.i]} ${y}</div>
        ${rows}
        <div class="abr-sum"><span>Verdient im ${ABR_MONTHS_LONG[d.i]}</span><b>${d.has ? fmtEuro(d.total) : '–'}</b></div>
        ${d.has && settings.ustPflicht ? `<div class="abr-net">🏛️ darin Umsatzsteuer (19 %): ${fmtEuro(abrUst(d.total))} – ans Finanzamt</div>` : ''}
        ${d.has && STEUER_PROZENT > 0 ? `<div class="abr-net">≈ ${fmtEuro(abrNet(d.total))} netto (−${STEUER_PROZENT}% Steuer${settings.ustPflicht ? ', ohne USt' : ''})</div>` : ''}
      </div>`;
  }).join('');
  const loose = settlements.filter(x => !x.windowId || !/^\d{4}-\d{2}-[AB]$/.test(x.windowId));
  const sugg = loose.map(x => ({ x, w: abrSuggestWindow(x) }));
  const suggCount = sugg.filter(z => z.w).length;
  const looseHtml = loose.length ? `

function invOverdue() {
  const t = todayKey();
  return invoices.filter(i => i.status !== 'bezahlt' && i.faellig && i.faellig < t);
}
function invWindows(n) { const out = []; for (let k = 1; k <= n; k++) { const w = windowOffsetBack(k); out.push({ w, id: w.id, label: fmtWindowRange(w.schreibStart, w.schreibEnd) + ' ' + w.schreibStart.getFullYear(), tracked: daysInRange(w.schreibStart, w.schreibEnd).reduce((t, k2) => t + dayTotal(data[k2]), 0) }); } return out; }
// Zeiträume mit getracktem Umsatz, für die noch keine Rechnung existiert
function invSuggestions() {
  return invWindows(8).filter(x => x.tracked > 0 && !invoices.some(i => i.windowId === x.id));
}
function invNewNumber() {
  const y = new Date().getFullYear();

function invCancel() { inv = null; invStatus = ''; render(); }
async function invSave() {

  if (!/^\d{4}-\d{2}-\d{2}$/.test(inv.datum || '')) { invStatus = 'Bitte gib das Rechnungsdatum ein.'; render(); return; }

function invPayStart(id) {

// Rechnung als PDF einlesen: Nummer, Datum, Betrag, Zahlungsziel
function parseInvoiceText(text) {
  const t = String(text || '').replace(/[  ]/g, ' ');
  const out = {};
  const nr = /Rechnungs?\s*(?:nummer|nr\.?)\s*[:#]?\s*([A-Za-z0-9][A-Za-z0-9\-\/\.]{2,})/i.exec(t);
  if (nr) out.nr = nr[1].replace(/[.,;]$/, '');
  const dt = /(?:Rechnungsdatum|Datum)\s*[:]?\s*(\d{1,2})\.(\d{1,2})\.(\d{4})/i.exec(t) || /(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(t);
  if (dt) out.datum = `${dt[3]}-${String(dt[2]).padStart(2, '0')}-${String(dt[1]).padStart(2, '0')}`;
  const amounts = [];
  const re = /(Gesamtbetrag|Rechnungsbetrag|Endbetrag|Bruttobetrag|Brutto|Summe|Gesamt|Zahlbetrag)[^\d\n]{0,40}?(\d{1,3}(?:\.\d{3})*,\d{2})/gi;
  let m; while ((m = re.exec(t))) amounts.push(parseFloat(m[2].replace(/\./g, '').replace(',', '.')));
  if (amounts.length) out.betrag = Math.max(...amounts);
  const zz = /Zahlungsziel[^\d]{0,25}(\d{1,3})\s*Tage/i.exec(t) || /innerhalb von\s*(\d{1,3})\s*Tagen/i.exec(t);
  if (zz) out.tage = Number(zz[1]);
  return out;
}
async function invPdf(event) {
  const f = event.target.files && event.target.files[0]; if (!f || !inv) return;
  invStatus = 'Lese PDF …'; render();
  try {
    const text = await extractPdfText(f);
    const r = parseInvoiceText(text);
    if (r.nr) inv.nr = r.nr;
    if (r.datum) inv.datum = r.datum;
    if (r.betrag) inv.betrag = String(r.betrag).replace('.', ',');
    inv.faellig = agDays(r.tage != null ? r.tage : (parseNum(agencyCfg().zahlungsziel) || 14), inv.datum);
    invStatus = (r.nr || r.betrag || r.datum) ? 'PDF eingelesen – bitte kurz prüfen.' : 'Im PDF wurde nichts Passendes gefunden. Bitte trage die Werte selbst ein.';
  } catch (e) { invStatus = 'Das PDF konnte nicht gelesen werden. Bitte trage die Werte selbst ein.'; }
  render();
}

// ---------- PDF-Export (ohne Bibliothek, funktioniert offline) ----------
function pdfEsc(str) {
  let o = '';
  for (const ch of String(str).replace(/[  ]/g, ' ')) {
    const c = ch.charCodeAt(0);
    let b = ch;
    if (ch === '€') b = '\x80';
    else if (ch === '–') b = '\x96';
    else if (ch === '−') b = '-';
    else if (c > 255) b = '?';
    if (b === '\\' || b === '(' || b === ')') b = '\\' + b;
    o += b;
  }
  return o;
}
function pdfEuro(n) { return Math.round(n).toLocaleString('de-DE').replace(/[  ]/g, ' ') + ' €'; }
function pdfTextW(str, size) {
  let w = 0;
  for (const ch of String(str)) w += (ch === ' ' || ch === '.' || ch === ',' ? 0.278 : ch === '1' ? 0.556 : 0.556) * size;
  return w;
}

async function downloadAbrechnungenPdf() {
  const y = abrYear;
  const data = abrYearData(y);
  const withTax = STEUER_PROZENT > 0;
  const ops = [];
  const text = (str, x, yy, size, bold, rightAlign, rgb) => {
    const xx = rightAlign ? x - pdfTextW(str, size) : x;
    ops.push(`${(rgb || [0.1, 0.12, 0.16]).join(' ')} rg BT /${bold ? 'F2' : 'F1'} ${size} Tf ${xx.toFixed(2)} ${yy.toFixed(2)} Td (${pdfEsc(str)}) Tj ET`);
  };
  const line = (x1, y1, x2, y2, rgb, w, dash) => ops.push(`${rgb.join(' ')} RG ${w} w ${dash ? '[4 3] 0 d' : '[] 0 d'} ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
  const circle = (cx, cy, r, rgb) => {
    const k = 0.5523 * r;
    ops.push(`${rgb.join(' ')} rg ${(cx + r).toFixed(2)} ${cy.toFixed(2)} m ${(cx + r).toFixed(2)} ${(cy + k).toFixed(2)} ${(cx + k).toFixed(2)} ${(cy + r).toFixed(2)} ${cx.toFixed(2)} ${(cy + r).toFixed(2)} c ${(cx - k).toFixed(2)} ${(cy + r).toFixed(2)} ${(cx - r).toFixed(2)} ${(cy + k).toFixed(2)} ${(cx - r).toFixed(2)} ${cy.toFixed(2)} c ${(cx - r).toFixed(2)} ${(cy - k).toFixed(2)} ${(cx - k).toFixed(2)} ${(cy - r).toFixed(2)} ${cx.toFixed(2)} ${(cy - r).toFixed(2)} c ${(cx + k).toFixed(2)} ${(cy - r).toFixed(2)} ${(cx + r).toFixed(2)} ${(cy - k).toFixed(2)} ${(cx + r).toFixed(2)} ${cy.toFixed(2)} c f`);
  };
  const BLUE = [0.16, 0.35, 0.9], GREEN = [0.09, 0.64, 0.29], GREY = [0.55, 0.58, 0.64], LIGHT = [0.87, 0.89, 0.92];

  // Kopf
  text('Meine Abrechnungen ' + y, 50, 790, 20, true);
  const who = settings.name ? settings.name + ' · ' : '';
  text(who + 'erstellt am ' + new Date().toLocaleDateString('de-DE') + ' · Start (to) count', 50, 772, 9, false, false, GREY);

  // Diagramm
  const x0 = 90, x1 = 545, yTop = 730, yBot = 560;
  const max = abrNiceMax(Math.max(0, ...data.map(d => d.total)));
  const px = i => x0 + ((x1 - x0) * i) / 11;
  const py = v => yBot + ((yTop - yBot) * v) / max;
  for (let k = 0; k <= 4; k++) {
    const v = (max * k) / 4;
    line(x0, py(v), x1, py(v), LIGHT, 0.6);
    text(pdfEuro(v), x0 - 6, py(v) - 3, 8, false, true, GREY);
  }
  data.forEach(d => text(ABR_MONTHS[d.i], px(d.i), yBot - 14, 8, false, false, GREY));
  const seg = (fn, rgb, w, dash) => {
    for (let i = 0; i < 11; i++) if (data[i].has && data[i + 1].has) line(px(i), py(fn(data[i])), px(i + 1), py(fn(data[i + 1])), rgb, w, dash);
  };
  seg(d => d.total, BLUE, 1.8);
  if (withTax) seg(d => abrNet(d.total), GREEN, 1.4, true);
  data.filter(d => d.has).forEach(d => {
    if (withTax) circle(px(d.i), py(abrNet(d.total)), 2.4, GREEN);
    circle(px(d.i), py(d.total), 2.8, BLUE);
    text(Math.round(d.total).toLocaleString('de-DE'), px(d.i) - pdfTextW(Math.round(d.total).toLocaleString('de-DE'), 7) / 2, py(d.total) + 6, 7, true);
  });
  circle(x0 + 4, yTop + 14, 3, BLUE); text('Brutto', x0 + 12, yTop + 11, 8, false, false, GREY);
  if (withTax) { circle(x0 + 60, yTop + 14, 3, GREEN); text('Netto (−' + STEUER_PROZENT + '% Steuer)', x0 + 68, yTop + 11, 8, false, false, GREY); }

  // Tabelle
  let ty = 520;
  const cA = 235, cB = 320, cT = 410, cN = 500;
  text('Monat', 50, ty, 9, true, false, GREY);
  text('Abrechnung 1', cA, ty, 9, true, true, GREY);
  text('Abrechnung 2', cB, ty, 9, true, true, GREY);
  text(withTax ? 'Brutto' : 'Verdient', cT + 40, ty, 9, true, true, GREY);
  if (withTax) text('Netto ca.', cN + 45, ty, 9, true, true, GREY);
  ty -= 6; line(50, ty, 545, ty, GREY, 0.8); ty -= 16;
  data.filter(d => d.has).forEach(d => {
    text(ABR_MONTHS_LONG[d.i], 50, ty, 10, false);
    text(d.hasA ? pdfEuro(d.a) : 'offen', cA, ty, 10, false, true, d.hasA ? undefined : GREY);
    text(d.hasB ? pdfEuro(d.b) : 'offen', cB, ty, 10, false, true, d.hasB ? undefined : GREY);
    text(pdfEuro(d.total), cT + 40, ty, 10, true, true);
    if (withTax) text(pdfEuro(abrNet(d.total)), cN + 45, ty, 10, false, true);
    ty -= 6; line(50, ty, 545, ty, LIGHT, 0.5); ty -= 16;
  });
  const total = data.reduce((t, d) => t + d.total, 0);
  line(50, ty + 10, 545, ty + 10, GREY, 1);
  text('Summe ' + y, 50, ty - 6, 11, true);
  text(pdfEuro(total), cT + 40, ty - 6, 11, true, true);
  if (withTax) text(pdfEuro(abrNet(total)), cN + 45, ty - 6, 11, true, true);
  if (settings.ustPflicht) text('Darin enthaltene Umsatzsteuer (19 %): ' + pdfEuro(abrUst(total)) + ' – ans Finanzamt weiterleiten', 50, ty - 24, 9, false, false, GREY);
  text('Beträge sind die ausgezahlten Brutto-Beträge aus deinen Abrechnungen.' + (withTax ? ' Netto = abzüglich ' + STEUER_PROZENT + '% Steuer (Schätzung).' : ''), 50, 40, 8, false, false, GREY);

  const content = ops.join('\n');
  const objs = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>',
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
  ];
  let pdf = '%PDF-1.4\n';
  const offs = [];
  objs.forEach((o, i) => { offs.push(pdf.length); pdf += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
  pdf += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes = new Uint8Array(pdf.length);
  for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 255;
  const blob = new Blob([bytes], { type: 'application/pdf' });
  // Im Claude-Artifact-Viewer: Speichern über die Download-Funktion der Plattform
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename: `Meine-Abrechnungen-${y}.pdf`, data: blob }); return; }
    }
  } catch (e) { if (e && e.code === 'declined') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Meine-Abrechnungen-${y}.pdf`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

let lastRenderedPage = null;

function render() {
  let html = '';

  if (currentPage === 'dashboard') {
    const enteringDashboard = lastRenderedPage !== 'dashboard';
    html += renderDashboardContent(buildStatsData(), enteringDashboard);
  } else if (currentPage === 'abrechnungen') {
    html += renderAbrechnungenContent();
  } else if (currentPage === 'team') {
    html += renderTeamContent();
  } else if (currentPage === 'rechnungen') {
    html += renderRechnungenContent();
  } else {
    html += renderTrackerContent();
  }

  document.getElementById('app').innerHTML = html;
  lastRenderedPage = currentPage;

  const wrapEl = document.getElementById('wrap');
  if (wrapEl) wrapEl.classList.toggle('wrap-wide', currentPage === 'dashboard' || currentPage === 'abrechnungen' || currentPage === 'team' || currentPage === 'rechnungen');
  if (wrapEl) wrapEl.classList.toggle('wrap-tracker', currentPage === 'tracker');

  if (currentPage === 'tracker') {
    const dp = document.getElementById('datePicker');
    if (dp) dp.addEventListener('change', (e) => {
      selectedDate = e.target.value || todayKey();
      render();
    });
  }

  updateNavTabs();
  updatePeriodToggle();
  updateMonthNav();
  updateZeitraumInfo();
  updateJahrNav();
  updateHeaderGreeting();
}

function updateMonthNav() {

function updateJahrNav() {

function updateNavTabs() {
  const tabTracker = document.getElementById('tab-tracker');
  const tabDashboard = document.getElementById('tab-dashboard');
  const tabAbr = document.getElementById('tab-abrechnungen');
  if (!tabTracker || !tabDashboard) return;
  tabTracker.classList.toggle('active', currentPage === 'tracker');
  tabDashboard.classList.toggle('active', currentPage === 'dashboard');
  if (tabAbr) tabAbr.classList.toggle('active', currentPage === 'abrechnungen');
  const tabTeam = document.getElementById('tab-team');
  if (tabTeam) {
    tabTeam.classList.toggle('active', currentPage === 'team');
    const n = (team && team.unread && currentPage !== 'team') ? team.unread : 0;
    tabTeam.innerHTML = 'Team' + (n ? ` <span class="tm-badge">${n > 9 ? '9+' : n}</span>` : '');
  }
  const tabInv = document.getElementById('tab-rechnungen');
  if (tabInv) {
    tabInv.style.display = isAgentur() ? '' : 'none';
    tabInv.classList.toggle('active', currentPage === 'rechnungen');
    const od = invOverdue().length;
    tabInv.innerHTML = 'Rechnungen' + (od ? ` <span class="tm-badge">${od > 9 ? '9+' : od}</span>` : '');
  }
  const map = { tracker: tabTracker, dashboard: tabDashboard, abrechnungen: tabAbr, team: tabTeam, rechnungen: tabInv };
  positionSlider('nav-slider', map[currentPage]);
}

function updatePeriodToggle() {
  const root = document.getElementById('period-toggle-root');
  if (!root) return;
  // In der Ausgezahlt-Ansicht des Dashboards ergibt Woche/Monat/Gesamt keinen Sinn,
  // da Abrechnungen nicht nach diesen Zeiträumen gefiltert werden.
  const showsPeriod = currentPage === 'dashboard';
  root.style.display = showsPeriod ? '' : 'none';
  if (!showsPeriod) return;
  const btnWoche = document.getElementById('btn-woche');
  const btnMonat = document.getElementById('btn-monat');
  const btnGesamt = document.getElementById('btn-gesamt');
  if (!btnWoche || !btnMonat || !btnGesamt) return;
  btnWoche.classList.toggle('active', statsPeriod === 'woche');
  btnMonat.classList.toggle('active', statsPeriod === 'monat');
  btnGesamt.classList.toggle('active', statsPeriod === 'gesamt');
  const activeBtn = statsPeriod === 'woche' ? btnWoche : (statsPeriod === 'monat' ? btnMonat : btnGesamt);
  positionSlider('period-slider', activeBtn);
}

function positionSlider(sliderId, activeBtn) {
  const slider = document.getElementById(sliderId);
  if (!slider || !activeBtn) return;
  slider.style.width = activeBtn.offsetWidth + 'px';
  slider.style.transform = 'translateX(' + activeBtn.offsetLeft + 'px)';
}

async function applyTheme(theme) {
  document.body.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}

async function toggleTheme() {
  const current = document.body.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  await applyTheme(next);
  const btn = document.getElementById('themeToggle');
  if (btn) {
    btn.classList.remove('spin');
    void btn.offsetWidth;
    btn.classList.add('spin');
  }
  try {
    localStorage.setItem(THEME_KEY, next);
  } catch (e) { /* Präferenz konnte nicht gespeichert werden, gilt nur für diese Sitzung */ }
  render();
}

async function loadTheme() {
  let theme = 'light';
  try {
    const stored = localStorage.getItem(THEME_KEY);
    if (stored === 'dark' || stored === 'light') theme = stored;
  } catch (e) { /* kein gespeichertes Theme, Standard bleibt light */ }
  await applyTheme(theme);
}

// ===== Onboarding / Einstellungen =====
// Mehrstufiger Dialog: Willkommen -> Rolle -> Provision -> (Overhead, nur Teamleiter) -> Details -> Fertig.
// Beim ersten Öffnen automatisch (mode 'first'), später über das Zahnrad im Header (mode 'edit').
let ob = null;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function parseNum(v) {
  if (v === null || v === undefined) return NaN;
  const s = String(v).trim().replace(',', '.');
  if (s === '') return NaN;
  return Number(s);
}

function fmtNumInput(n) {
  return String(n).replace('.', ',');
}

function fmtNumPlain(n) {
  return (Math.round(n * 100) / 100).toLocaleString('de-DE', { maximumFractionDigits: 2 }) + ' €';
}

function obSteps() {
  if (ob && ob.role === 'agentur') return ['welcome', 'prinzip', 'rolle', 'agentur', 'provision', 'fertig'];
  return ob && ob.role === 'teamleiter'
    ? ['welcome', 'prinzip', 'rolle', 'provision', 'overhead', 'weiteres', 'fertig']
    : ['welcome', 'prinzip', 'rolle', 'provision', 'weiteres', 'fertig'];
}
// Im Bearbeiten-Modus (⚙️) startet der Dialog direkt bei der Rolle
function obFirstStep() { return ob && ob.mode !== 'first' ? 2 : 0; }

function getObRoot() {
  let root = document.getElementById('onboarding-root');
  if (!root) {
    root = document.createElement('div');
    root.id = 'onboarding-root';
    document.body.appendChild(root);
  }
  return root;
}

function openOnboarding(mode) {
  const edit = mode === 'edit' || mode === 'settings';
  // Wer die App schon mit Daten nutzt, bekommt seine bisherigen Werte vorausgefüllt
  const hasData = Object.keys(data).length > 0 || settlements.length > 0 || settings.fixkosten > 0;
  const prefill = edit || hasData;
  ob = {
    mode: mode === 'settings' ? 'settings' : edit ? 'edit' : 'first',
    step: edit ? 2 : 0,
    name: settings.name || '',
    role: roleOf(settings.role),
    ag: agencyToForm(agencyCfg()),
    agQ: 0,
    // Beim ersten Mal bewusst leer, damit jeder SEINE Provision eintippt (statt Standardwerte zu übernehmen)
    preisNeu: prefill ? fmtNumInput(settings.preisNeu) : '',
    preisBestand: prefill ? fmtNumInput(settings.preisBestand) : '',
    // Steuersatz ist optional: leer = keine Netto-/Steuer-Anzeige. Bei 0 bleibt das Feld ebenfalls leer.
    steuer: !prefill ? '' : (settings.steuer > 0 ? fmtNumInput(settings.steuer) : ''),
    fixkosten: settings.fixkosten ? fmtNumInput(settings.fixkosten) : '',
    ust: !!settings.ustPflicht,
    stornoAufschlag: !!settings.stornoAufschlag,
    runden: !!settings.zielAufrunden,
    goalName: settings.goalName || '',
    mine: settings.mineAmount ? fmtNumInput(settings.mineAmount) : '',
    goalAmount: settings.goalAmount ? fmtNumInput(settings.goalAmount) : '',
    goalPeriod: goalPeriodOf(settings.goalPeriod),
    goalCount: String(goalCountOf(settings.goalCount)),
    goalUnit: goalUnitOf(settings.goalUnit),
    goalStart: settings.goalStart || '',
    overheadNeu: settings.overheadNeu ? fmtNumInput(settings.overheadNeu) : '',
    error: ''
  };
  renderOnboarding();
}

function closeOnboarding() {
  const root = getObRoot();
  root.innerHTML = '';
  ob = null;
}

function obSet(field, value) {
  if (!ob) return;
  ob[field] = value;
  ob.error = '';
  if (ob.mode === 'settings') {
    const el = document.getElementById('ob-breakdown');
    if (el) el.innerHTML = obBreakdownInner();
  }
}

function obSetRunden(on) { obSet('runden', !!on); }

// Live-Aufschlüsselung des Brutto-Ziels aus den Werten im Einstellungs-Dialog
function obBreakdownInner() {
  const per = goalPeriodOf(ob.goalPeriod);
  const amt = Math.max(0, parseNum(ob.goalAmount) || 0);
  const monthly = per === 'woche' ? amt * 52 / 12 : per === 'jahr' ? amt / 12
    : per === 'custom' ? amt / goalCustomMonths(ob.goalCount, ob.goalUnit) : amt;
  const stPct = ob.stornoAufschlag ? avgStornoQuote().pct : 0;
  const taxPct = Math.max(0, parseNum(ob.steuer) || 0);
  const a = zielAufbauCalc({
    fix: Math.max(0, parseNum(ob.fixkosten) || 0),
    goal: monthly / 2,
    mine: Math.max(0, parseNum(ob.mine) || 0) / 2,
    taxPct, stornoPct: stPct, runden: !!ob.runden,
  });
  const gname = String(ob.goalName || '').trim();
  return a.total > 0 ? `
    ${a.fix > 0 ? `<div><span>Fixkosten</span><b>${fmtEuro(a.fix)}</b></div>` : ''}
    ${a.mine > 0 ? `<div><span>Nur für mich übrig (Monatsbetrag ÷ 2)</span><b>+ ${fmtEuro(a.mine)}</b></div>` : ''}
    ${a.goal > 0 ? `<div><span>Persönliches Ziel${gname ? ' (' + escapeHtml(gname) + ')' : ''}</span><b>+ ${fmtEuro(a.goal)}</b></div>` : ''}
    ${taxPct > 0 ? `<div><span>Steuer (+${taxPct}%)</span><b>+ ${fmtEuro(a.tax)}</b></div>` : ''}
    ${stPct > 0 ? `<div><span>Storno-Puffer (+${fmtPct(stPct)})</span><b>+ ${fmtEuro(a.storno)}</b></div>` : ''}
    ${a.round > 0.005 ? `<div><span>Aufgerundet (auf volle 10 €)</span><b>+ ${fmtEuro(a.round)}</b></div>` : ''}
    <div class="sum"><span>= Brutto-Ziel pro Abrechnungsperiode</span><b>${fmtEuro(a.total)}</b></div>`
    : '<div><span>Trag oben Fixkosten, Ziel oder „Nur für mich übrig“ ein – dann siehst du hier dein Brutto-Ziel.</span></div>';
}

function obSetChip(field, value) {
  obSet(field, value);
  renderOnboarding();
}

function obSetUst(on) {
  if (!ob) return;
  ob.ust = !!on;
  renderOnboarding();
}

function obToggleRunden() {
  if (!ob) return;
  ob.runden = !ob.runden;
  renderOnboarding();
}

// ---- Agentur-Einrichtung ----
function agencyToForm(a) {
  return { ...a, vertrieb: [...(a.vertrieb || [])], produkt: [...(a.produkt || [])], partners: [...(a.partners || [])], tage: [...(a.tage || [])], kpi: [...(a.kpi || [])], newPartner: '', new_vertrieb: '', new_produkt: '' };
}
function agencyFromForm(f) {
  const d = defaultAgency(), o = {};
  Object.keys(d).forEach(k => { o[k] = f[k] !== undefined ? f[k] : d[k]; });
  ['vertrieb', 'produkt', 'partners', 'tage', 'kpi'].forEach(k => { o[k] = Array.isArray(o[k]) ? o[k].slice() : []; });
  const np = String(f.newPartner || '').trim();
  if (np && !o.partners.includes(np)) o.partners.push(np);
  ['rechnungFrist', 'zahlungsziel', 'haftungMonate', 'einbehaltPct', 'maNeu', 'maBestand', 'tagesziel'].forEach(k => { o[k] = String(o[k] == null ? '' : o[k]).trim(); });
  o.notiz = String(o.notiz || '').slice(0, 300);
  ['vertrieb', 'produkt'].forEach(k => { const t = String(f['new_' + k] || '').trim(); if (t && !o[k].includes(t)) o[k].push(t); });
  o.rechnungRhythmText = String(o.rechnungRhythmText || '').trim().slice(0, 60); o.maRhythmText = String(o.maRhythmText || '').trim().slice(0, 60);
  return o;
}
function agSet(field, value) { if (!ob) return; ob.ag[field] = value; ob.error = ''; }
function agToggle(field, key) {
  if (!ob) return;
  const arr = ob.ag[field], i = arr.indexOf(key);
  if (i >= 0) arr.splice(i, 1); else arr.push(key);
  renderOnboarding();
}
function agPick(field, key) { if (!ob) return; ob.ag[field] = key; renderOnboarding(); }
function agAddPartner() {
  if (!ob) return;
  const v = String(ob.ag.newPartner || '').trim();
  if (v && !ob.ag.partners.includes(v)) ob.ag.partners.push(v);
  ob.ag.newPartner = '';
  renderOnboarding();
}
function agRemovePartner(i) { if (ob) { ob.ag.partners.splice(i, 1); renderOnboarding(); } }
const AG_QUIZ = ['vertrieb', 'produkt', 'partner', 'rechnung', 'zahlung', 'haftung', 'ausz', 'maprov', 'storno', 'ust'];
function agAddCustom(field) {
  if (!ob) return;
  const v = String(ob.ag['new_' + field] || '').trim();
  if (v && !ob.ag[field].includes(v)) ob.ag[field].push(v);
  ob.ag['new_' + field] = '';
  renderOnboarding();
}

    ${custom ? `<div class="ag-row"><input class="ob-input" type="text" maxlength="40" value="${escapeHtml(a['new_' + field])}" placeholder="Eigene Option (Benutzerdefiniert)" oninput="agSet('new_${field}', this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();agAddCustom('${field}');}"><button type="button" class="tm-btn" onclick="agAddCustom('${field}')">Hinzufügen</button></div>` : ''}`;
  const single = (field, list) => `<div class="ag-chips">${list.map(([k, l]) => `<button type="button" class="ag-chip ${a[field] === k ? 'on' : ''}" onclick="agPick('${field}','${k}')">${l}</button>`).join('')}</div>`;

  const num = (field, label, unit, ph, hint) => `<label class="ob-field"><span>${label}</span><div class="ob-input-wrap"><input class="ob-input" type="text" inputmode="decimal" value="${escapeHtml(a[field])}" placeholder="${ph || ''}" oninput="agSet('${field}', this.value)"><span class="ob-unit">${unit}</span></div>${hint ? `<small>${hint}</small>` : ''}</label>`;
  const txt = (field, label, ph) => `<label class="ob-field"><span>${label}</span><input class="ob-input" type="text" value="${escapeHtml(a[field])}" placeholder="${ph || ''}" oninput="agSet('${field}', this.value)"></label>`;
  if (q === 'vertrieb') return `<div class="ob-section-title">🎯 Welche Vertriebsart machst du? <em>(mehrere möglich)</em></div>${multi('vertrieb', AG_VERTRIEB, true)}`;
  if (q === 'produkt') return `<div class="ob-section-title">📦 Welches Produkt / welche Branche? <em>(mehrere möglich)</em></div>${multi('produkt', AG_PRODUKT, true)}`;
  if (q === 'partner') return `<div class="ob-section-title">🏢 Wer sind deine Anbieter (Auftraggeber)?</div>
      <div class="ag-chips">${a.partners.map((p, i) => `<span class="ag-chip on">${escapeHtml(p)} <b onclick="agRemovePartner(${i})" title="Entfernen">×</b></span>`).join('')}</div>
      <div class="ag-row"><input class="ob-input" type="text" value="${escapeHtml(a.newPartner)}" placeholder="Name des Anbieters" oninput="agSet('newPartner', this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();agAddPartner();}"><button type="button" class="tm-btn" onclick="agAddPartner()">Hinzufügen</button></div>`;
  if (q === 'rechnung') return `<div class="ob-section-title">🧾 Wie oft rechnest du mit dem Anbieter ab?</div>${single('rechnungRhythm', AG_RHYTHM)}${customRhythm('rechnungRhythm')}
      ${num('rechnungFrist', 'Rechnung stellen innerhalb von … Tagen nach Zeitraum-Ende', 'Tage', '3')}`;
  if (q === 'zahlung') return `<div class="ob-section-title">⏳ Wann zahlt der Anbieter?</div>
      ${num('zahlungsziel', 'Zahlungsziel des Anbieters', 'Tage', '14', 'Daraus berechnet die App, wann das Geld spätestens da sein muss.')}`;
  if (q === 'haftung') return `<div class="ob-section-title">🛡️ Storno-Haftung beim Anbieter</div>
      ${num('haftungMonate', 'Storno-Haftungszeit', 'Monate', '12', 'So lange kann der Anbieter Provision zurückfordern.')}
      ${num('einbehaltPct', 'Einbehalt / Stornoreserve (optional)', '%', 'z. B. 10')}`;
  if (q === 'ausz') return `<div class="ob-section-title">💶 Wie oft zahlst du an deine Mitarbeiter aus?</div>${single('maRhythm', AG_RHYTHM)}${customRhythm('maRhythm')}
      ${txt('maTag', 'Auszahlungstag(e) (optional)', 'z. B. 25. des Monats oder freitags')}`;
  if (q === 'maprov') return `<div class="ob-section-title">💰 Was bekommen deine Mitarbeiter pro Auftrag?</div>
      ${num('maNeu', 'Provision pro Neukunde', '€', 'z. B. 80', 'Wird im Team als Vorgabe verteilt.')}
      ${num('maBestand', 'Provision pro Bestandskunde', '€', 'z. B. 10')}`;

  if (q === 'ust') return `<div class="ob-section-title">🧾 Umsatzsteuerpflichtig (19 %)?</div>
      <div class="ob-chips" style="margin-top:6px"><button type="button" class="ob-chip ${ob.ust ? 'active' : ''}" onclick="obSetUst(true);renderOnboarding()">Ja</button><button type="button" class="ob-chip ${!ob.ust ? 'active' : ''}" onclick="obSetUst(false);renderOnboarding()">Nein</button></div>

function agencyStepHtml() {
  const head = `<h2 class="ob-title">Deine Agentur</h2>`;
  if (ob.mode === 'settings') return AG_QUIZ.map(q => `<div class="ag-sec">${agQuestionHtml(q)}</div>`).join('');
  const n = AG_QUIZ.length, k = Math.min(ob.agQ || 0, n - 1);
  return `${head}<div class="ag-prog"><span>Frage ${k + 1} von ${n}</span><div class="ag-bar"><i style="width:${Math.round((k + 1) / n * 100)}%"></i></div></div>
    <p class="ob-sub">Nur Finanzen, Abschlüsse, Stornos und Auszahlungen – damit deine Mitarbeiter ihre Zahlen inkl. Steuern und Stornos im Blick haben.</p>
    <div class="ag-q">${agQuestionHtml(AG_QUIZ[k])}</div>`;
}

function obSetRole(role) {
  obSet('role', role);
  renderOnboarding();
}

function obValidateStep() { return obValidate(obSteps()[ob.step]); }

function obValidate(step) {
  if (step === 'agentur') {
    if (ob.ag.rechnungRhythm === 'custom' && !String(ob.ag.rechnungRhythmText || '').trim()) return 'Bitte beschreibe, wie oft du abrechnest.';
    if (ob.ag.maRhythm === 'custom' && !String(ob.ag.maRhythmText || '').trim()) return 'Bitte beschreibe, wie oft du auszahlst.';
    return '';
  }
  if (step === 'provision') {
    const n = parseNum(ob.preisNeu), b = parseNum(ob.preisBestand);
    if (!(n >= 0) || !(b >= 0)) return 'Bitte gib beide Beträge in € ein (z. B. 110 und 15).';
  }
  if (step === 'overhead') {
    const n = parseNum(ob.overheadNeu);
    if (!(n >= 0)) return 'Bitte gib den Overhead pro Neukunden-Auftrag in € ein.';
  }
  if (step === 'weiteres') {
    if (String(ob.steuer).trim() !== '') {
      const s = parseNum(ob.steuer);
      if (!(s >= 0 && s < 100)) return 'Der Steuersatz muss zwischen 0 und 99 % liegen (oder leer bleiben).';
    }
    if (String(ob.fixkosten).trim() !== '' && !(parseNum(ob.fixkosten) >= 0)) return 'Die Fixkosten müssen eine Zahl sein (oder leer bleiben).';
    if (String(ob.mine).trim() !== '' && !(parseNum(ob.mine) >= 0)) return 'Der Betrag „nur für mich“ muss eine Zahl sein (oder leer bleiben).';
    if (String(ob.goalAmount).trim() !== '' && !(parseNum(ob.goalAmount) >= 0)) return 'Das Finanzziel muss eine Zahl sein (oder leer bleiben).';
  }
  return '';
}

function obNext() {
  if (!ob) return;
  const err = obValidateStep();
  if (err) { ob.error = err; renderOnboarding(); return; }
  const steps = obSteps();
  if (steps[ob.step] === 'agentur' && ob.mode !== 'settings' && (ob.agQ || 0) < AG_QUIZ.length - 1) { ob.agQ = (ob.agQ || 0) + 1; renderOnboarding(); return; }
  if (ob.step < steps.length - 1) ob.step++;
  renderOnboarding();
}

function obBack() {
  if (!ob) return;
  const min = obFirstStep();
  if (obSteps()[ob.step] === 'agentur' && ob.mode !== 'settings' && (ob.agQ || 0) > 0) { ob.agQ--; ob.error = ''; renderOnboarding(); return; }
  if (ob.step > min) ob.step--;
  if (obSteps()[ob.step] === 'agentur') ob.agQ = AG_QUIZ.length - 1;
  ob.error = '';
  renderOnboarding();
}

async function obFinish() {
  if (!ob) return;
  settings.name = String(ob.name || '').trim().slice(0, 40);
  if (settings.name) {
    const ap = activeProfile();
    if (ap && !profiles.list.some(p => p !== ap && p.name.toLowerCase() === settings.name.toLowerCase())) { ap.name = settings.name; saveProfiles(); }
  }
  settings.role = roleOf(ob.role);
  if (settings.role === 'agentur') settings.agency = agencyFromForm(ob.ag);
  settings.preisNeu = parseNum(ob.preisNeu) >= 0 ? parseNum(ob.preisNeu) : settings.preisNeu;
  settings.preisBestand = parseNum(ob.preisBestand) >= 0 ? parseNum(ob.preisBestand) : settings.preisBestand;
  settings.steuer = parseNum(ob.steuer) >= 0 && parseNum(ob.steuer) < 100 ? parseNum(ob.steuer) : 0; // leer = keine Steuer
  settings.fixkosten = parseNum(ob.fixkosten) >= 0 ? parseNum(ob.fixkosten) : 0;
  settings.stornoAufschlag = !!ob.stornoAufschlag;
  settings.ustPflicht = !!ob.ust;
  settings.zielAufrunden = !!ob.runden;
  settings.goalName = String(ob.goalName || '').trim().slice(0, 40);
  settings.mineAmount = parseNum(ob.mine) >= 0 ? parseNum(ob.mine) : 0;
  settings.goalAmount = parseNum(ob.goalAmount) >= 0 ? parseNum(ob.goalAmount) : 0;
  settings.goalPeriod = goalPeriodOf(ob.goalPeriod);
  settings.goalCount = goalCountOf(ob.goalCount);
  settings.goalUnit = goalUnitOf(ob.goalUnit);
  settings.goalStart = settings.goalPeriod === 'custom' ? (/^\d{4}-\d{2}-\d{2}$/.test(ob.goalStart) ? ob.goalStart : (settings.goalStart || todayKey())) : (settings.goalStart || '');
  settings.overheadNeu = parseNum(ob.overheadNeu) >= 0 ? parseNum(ob.overheadNeu) : 0;
  settings.onboarded = true;
  applySettings();
  await saveData();
  closeOnboarding();
  render();
  checkFireworksTrigger();
  if (typeof teamPushRules === 'function') teamPushRules();
}

// ---------- Einstellungen: alles auf einer Seite bearbeiten ----------
function openSettings() { openOnboarding('settings'); }

function obSaveSettings() {
  if (!ob) return;
  const toCheck = ['provision'].concat(ob.role === 'teamleiter' ? ['overhead'] : []).concat(ob.role === 'agentur' ? ['agentur'] : ['weiteres']);
  for (const st of toCheck) {
    const err = obValidate(st);
    if (err) { ob.error = err; renderSettingsPage(); return; }

  obFinish();
}

  activateProfile(id);

function createProfile() {
  const name = String((pf && pf.newName) || '').trim().slice(0, 40);
  if (!name) { pf.error = 'Bitte gib einen Namen ein.'; renderProfiles(); return; }
  if (profiles.list.some(p => p.name.toLowerCase() === name.toLowerCase())) { pf.error = 'Dieser Name ist schon vergeben.'; renderProfiles(); return; }
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  profiles.list.push({ id, name });
  activateProfile(id);
}

function deleteProfile(id) {
  if (id === 'main') return;
  try { localStorage.removeItem(storageKeyFor(id)); } catch (e) { /* ignorieren */ }
  profiles.list = profiles.list.filter(p => p.id !== id);
  const wasActive = profiles.active === id;
  saveProfiles();
  if (wasActive) { activateProfile('main'); return; }
  pf.confirmDelete = null;
  renderProfiles();
}

function cloudErrText(e) {
  const m = String((e && e.message) || e || '');
  if (/invalid login/i.test(m)) return 'E-Mail oder Passwort stimmt nicht.';
  if (/already registered|already been registered/i.test(m)) return 'Diese E-Mail hat schon ein Konto – bitte anmelden.';
  if (/password should be|at least/i.test(m)) return 'Das Passwort ist zu kurz (mindestens 6 Zeichen).';
  if (/email not confirmed/i.test(m)) return 'Bitte bestätige zuerst deine E-Mail (Link in der Bestätigungs-Mail).';
  if (/rate limit|too many/i.test(m)) return 'Zu viele Versuche – bitte kurz warten.';
  if (/fetch|network/i.test(m)) return 'Keine Verbindung zum Server.';
  return m || 'Etwas ist schiefgelaufen.';
}

function cloudPayload() { return { days: data, events: events, settlements: settlements, invoices: invoices, settings: settings }; }
function cloudHasLocalData() { return Object.keys(data).length > 0 || events.length > 0 || settlements.length > 0; }

function cloudMarkDirty() {
  const l = cloudLink();
  if (!l || !cl.session || l.profileId !== profiles.active || l.applying) return;
  l.dirty = true; cloudSetLink(l);
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => cloudPush(), 1500);
}

async function cloudPush() {
  const sb = getCloud(); const l = cloudLink();
  if (!sb || !cl.session || !l || l.profileId !== profiles.active) return false;
  const ts = new Date().toISOString();
  const { error } = await sb.from('user_data').upsert({ user_id: cl.session.user.id, payload: cloudPayload(), updated_at: ts });
  if (error) { cl.err = 'Sync fehlgeschlagen: ' + cloudErrText(error); cloudRerender(); return false; }
  l.ts = ts; l.dirty = false; cloudSetLink(l);
  cl.lastSync = new Date(); cl.err = '';
  cloudRerender();
  return true;
}

async function cloudApply(payload, ts) {
  const l = cloudLink() || {};
  l.applying = true; cloudSetLink(l);
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) { /* ignorieren */ }
  await loadData();
  render(); updateHeaderGreeting();
  l.applying = false; l.ts = ts; l.dirty = false; cloudSetLink(l);
  cl.lastSync = new Date();
  if (typeof teamMarkDirty === 'function') teamMarkDirty();
}

// Nach Anmeldung bzw. beim Start: Cloud und Gerät abgleichen
async function cloudReconcile() {
  const sb = getCloud();
  if (!sb || !cl.session) return;
  const uid = cl.session.user.id;
  let l = cloudLink();
  if (!l || l.uid !== uid) { l = { uid, profileId: profiles.active, ts: null, dirty: false }; cloudSetLink(l); }
  if (l.profileId !== profiles.active && profiles.list.some(p => p.id === l.profileId)) activateProfile(l.profileId);
  const { data: row, error } = await sb.from('user_data').select('payload, updated_at').eq('user_id', uid).maybeSingle();
  if (error) { cl.err = 'Sync fehlgeschlagen: ' + cloudErrText(error); return; }
  if (!row) { l.dirty = true; cloudSetLink(l); await cloudPush(); return; }
  const cloudChanged = row.updated_at !== l.ts;
  if (!l.ts) {
    if (!cloudHasLocalData()) { await cloudApply(row.payload, row.updated_at); return; }
    cl.conflict = { payload: row.payload, ts: row.updated_at }; return;
  }
  if (cloudChanged && l.dirty) { cl.conflict = { payload: row.payload, ts: row.updated_at }; return; }
  if (cloudChanged) { await cloudApply(row.payload, row.updated_at); return; }
  if (l.dirty) await cloudPush();
}

async function cloudResolve(useCloud) {
  const c = cl.conflict; if (!c) return;
  cl.conflict = null;
  if (useCloud) await cloudApply(c.payload, c.ts);
  else { const l = cloudLink(); l.ts = c.ts; l.dirty = true; cloudSetLink(l); await cloudPush(); }
  if (gateOn) await startApp(); else cloudRerender();
}

async function cloudAuth(mode) {
  const sb = getCloud();
  if (!sb) { cl.err = 'Die Cloud ist auf diesem Gerät gerade nicht erreichbar.'; cloudRerender(); return; }
  const email = String(cl.email || '').trim();
  if (!email || !/.+@.+\..+/.test(email)) { cl.err = 'Bitte gib eine gültige E-Mail-Adresse ein.'; cloudRerender(); return; }
  if (mode !== 'reset' && String(cl.pw || '').length < 6) { cl.err = 'Das Passwort braucht mindestens 6 Zeichen.'; cloudRerender(); return; }
  cl.busy = true; cl.err = ''; cl.msg = ''; cloudRerender();
  try {
    if (mode === 'reset') {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0].split('?')[0] });
      if (error) throw error;
      cl.msg = 'Wir haben dir einen Link zum Zurücksetzen per E-Mail geschickt.';
    } else if (mode === 'signup') {
      const { data: d, error } = await sb.auth.signUp({ email, password: cl.pw });
      if (error) throw error;

// Kennzahlen aus den eigenen Daten (ohne Overhead, damit alle vergleichbar sind)
function teamPeriodStats(dates) {
  let umsatz = 0, neu = 0, bestand = 0, stN = 0, stB = 0, days = 0, best = 0;
  dates.forEach(k => {
    const e = data[k]; if (!e) return;
    const v = dayTotal(e) - overheadOf(e);
    neu += e.neu || 0; bestand += e.bestand || 0; stN += e.storno_neu || 0; stB += e.storno_bestand || 0;
    if ((e.neu || 0) + (e.bestand || 0) > 0) days++;
    umsatz += v; if (v > best) best = v;
  });
  const gross = neu + bestand, storno = stN + stB;
  return { umsatz: Math.round(umsatz * 100) / 100, orders: gross - storno, neu, bestand, storno,
    stornoQuote: gross > 0 ? Math.round(storno / gross * 1000) / 10 : 0, days, best: Math.round(best * 100) / 100,
    avgDay: days > 0 ? Math.round(umsatz / days * 100) / 100 : 0 };
}
function teamComputeStats() {
  const win = windowOffsetBack(0);
  const year = String(new Date().getFullYear());
  const today = todayKey();
  const sets = { woche: daysInRange(win.schreibStart, win.schreibEnd), monat: monthDaysForOffset(0), jahr: Object.keys(data).filter(k => k.startsWith(year)) };
  // Vergleich immer mit dem Vortag: Umsatz heute vs. gestern
  const yd = new Date(); yd.setDate(yd.getDate() - 1);
  const pub = {}, det = {};
  Object.keys(sets).forEach(p => { const st = teamPeriodStats(sets[p]); pub[p] = { umsatz: st.umsatz, orders: st.orders }; det[p] = st; });
  pub.tag = { day: today, umsatz: teamPeriodStats([today]).umsatz, prev: teamPeriodStats([todayKey(yd)]).umsatz };
  return { pub, det };
}
function teamMarkDirty() {
  if (!team.me || !cl.session) return;
  clearTimeout(teamTimer);
  teamTimer = setTimeout(() => teamPushStats(), 2500);
}
async function teamPushStats() {
  const sb = teamSb(); if (!sb || !team.me) return;
  const { pub, det } = teamComputeStats();
  const uid = cl.session.user.id, ts = new Date().toISOString();
  const a = await sb.from('team_stats').upsert({ user_id: uid, team_id: team.me.team_id, stats: pub, updated_at: ts });
  const b = await sb.from('team_stats_detail').upsert({ user_id: uid, team_id: team.me.team_id, stats: det, updated_at: ts });
  if (a.error || b.error) { team.err = 'Kennzahlen konnten nicht gesendet werden: ' + cloudErrText(a.error || b.error); }
  else { team.stats[uid] = { user_id: uid, team_id: team.me.team_id, stats: pub, updated_at: ts }; team.detail[uid] = { user_id: uid, team_id: team.me.team_id, stats: det, updated_at: ts }; }
  if (currentPage === 'team') render();
}
// Tagesvergleich eines Mitglieds: heute vs. gestern (veraltete Zahlen von gestern werden korrekt eingeordnet)
function teamDayCmp(stats) {
  const t = stats && stats.tag; if (!t || !t.day) return null;
  const today = todayKey(), yd = new Date(); yd.setDate(yd.getDate() - 1);
  if (t.day === today) return { cur: t.umsatz || 0, prev: t.prev || 0 };
  if (t.day === todayKey(yd)) return { cur: 0, prev: t.umsatz || 0 };
  return { cur: 0, prev: 0 };
}

function teamByUser(rows) { const o = {}; (rows || []).forEach(r => { o[r.user_id] = r; }); return o; }

async function teamLoad() {
  const sb = teamSb(); if (!sb) return;
  team.loading = true;
  try {
    const uid = cl.session.user.id;
    const mem = await sb.from('team_members').select('*');
    if (mem.error) throw mem.error;
    team.members = mem.data || [];
    team.me = team.members.find(m => m.user_id === uid) || null;
    if (!team.me) { team.info = null; team.stats = {}; team.detail = {}; }
    else {
      const [t, st, de] = await Promise.all([sb.from('teams').select('*').eq('id', team.me.team_id).maybeSingle(), sb.from('team_stats').select('*'), sb.from('team_stats_detail').select('*')]);
      for (const r of [t, st, de]) if (r.error) throw r.error;
      team.info = t.data; team.stats = teamByUser(st.data); team.detail = teamByUser(de.data);
      teamApplyRules();
    }
    team.sqlMissing = false; team.err = '';
    const own = team.me && team.stats[uid];

  }
  team.loading = false; team.loaded = true;
  if (team.me) { await teamPushStats(); await teamLoadEvents(true); teamStartPoll(); }

}
async function teamCheckPending() {

  else { team.pendingCode = ''; team.pendingName = ''; if (r && !r.error) { try { localStorage.removeItem(TEAM_PENDING_KEY); } catch (e) { /* ignorieren */ } team.err = 'Der Einladungslink ist ungültig oder abgelaufen.'; } }

// ---- Aktivitäts-Log + Benachrichtigungen ----
function teamKindText(ev, you) {
  const who = you ? 'Du' : ev.display_name;
  return ev.kind === 'neu' ? `${who} ${you ? 'hast' : 'hat'} einen Neukunden geschrieben` : `${who} ${you ? 'hast' : 'hat'} einen Bestandskunden geschrieben`;
}
const teamEvLimit = 100;
function teamDayKey(iso) { return todayKey(new Date(iso)); }
// Erster Auftrag je Kalendertag (nur wenn der Tag vollständig geladen ist)
function teamFirstOfDayIds(list) {
  const asc = (list || []).slice().sort((a, b) => Number(a.id) - Number(b.id));
  const firstByDay = {};
  asc.forEach(e => { const d = teamDayKey(e.created_at); if (!(d in firstByDay)) firstByDay[d] = e; });
  const oldest = asc.length ? teamDayKey(asc[0].created_at) : null;
  const ids = new Set();
  Object.keys(firstByDay).forEach(d => { if ((list || []).length < teamEvLimit || d !== oldest) ids.add(Number(firstByDay[d].id)); });
  return ids;
}
function teamDayLabel(dk) {
  const t = todayKey(), y = new Date(); y.setDate(y.getDate() - 1);
  if (dk === t) return 'Heute';
  if (dk === todayKey(y)) return 'Gestern';
  return new Date(dk + 'T12:00:00').toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
}
function teamAmountText(ev) {
  if (ev.amount == null || ev.amount === '') return '';
  const a = Number(ev.amount), d = ev.day_total == null ? null : Number(ev.day_total);
  return `+${fmtEuro(a)}${d != null && !isNaN(d) ? ` · Tagesstand ${fmtEuro(d)}` : ''}`;
}
function teamAgo(iso) {
  const sec = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (sec < 60) return 'gerade eben';
  if (sec < 3600) return `vor ${Math.round(sec / 60)} Min`;
  if (sec < 86400) return `vor ${Math.round(sec / 3600)} Std`;
  return new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' + new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}
function teamToast(msg) {
  let el = document.getElementById('tm-toast');
  if (!el) { el = document.createElement('div'); el.id = 'tm-toast'; el.className = 'tm-toast'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(teamToast.t); teamToast.t = setTimeout(() => { el.style.display = 'none'; }, 4500);
}
function teamNotifyOn() { return settings.teamNotify !== false; }
function teamNotify(evs) {
  if (!evs.length || !teamNotifyOn()) return;
  const last = evs[0];
  const firstIds = teamFirstOfDayIds(team.events);
  const amt = teamAmountText(last);

async function teamLoadEvents(initial) {
  const sb = teamSb(); if (!sb || !team.me) return;
  const r = await sb.from('team_events').select('*').order('id', { ascending: false }).limit(teamEvLimit);
  if (r.error) { team.eventsOk = false; return; }
  team.eventsOk = true;
  const list = r.data || [];
  const maxId = list.reduce((m, e) => Math.max(m, Number(e.id)), 0);
  if (initial || team.lastId === null) team.lastId = maxId;
  else {
    const uid = cl.session.user.id;
    const fresh = list.filter(e => Number(e.id) > team.lastId && e.user_id !== uid);
    team.lastId = Math.max(team.lastId, maxId);
    team.events = list;
    if (fresh.length) { if (currentPage !== 'team') team.unread += fresh.length; teamNotify(fresh); }

}
// Echtzeit-Verbindung (sofort, sparsam) + Absicherung: alle 30 s nachfragen, nur wenn die App sichtbar ist
function teamStartPoll() {
  if (team.pollTimer) clearInterval(team.pollTimer);
  team.pollTimer = setInterval(() => { if (document.visibilityState === 'visible') teamLoadEvents(false); }, 30000);
  const sb = teamSb();
  if (sb && team.me && sb.channel && !team.channel) {
    try {
      team.channel = sb.channel('team-events-' + team.me.team_id)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'team_events', filter: 'team_id=eq.' + team.me.team_id }, () => teamLoadEvents(false))
        .subscribe();
    } catch (e) { team.channel = null; }
  }
  if (!teamStartPoll.bound) {

    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && team.me) teamLoadEvents(false); });
  }
}
async function teamSendEvent(kind, delta, dateKey) {

  }).join('');
  let html = card(`<div class="tm-top"><div><h2 class="tm-h">${escapeHtml(team.info ? team.info.name : 'Team')}</h2><p class="tm-sub" style="margin:0">${team.members.length} ${team.members.length === 1 ? 'Mitglied' : 'Mitglieder'}${leader ? ' · du bist Teamleiter' : ''}</p></div>${seg}</div>
    <div class="tm-kpis"><div class="tm-kpi"><b>${fmtEuro(total)}</b>${teamBadge}<span>Team-Umsatz</span></div><div class="tm-kpi"><b>${totalOrders}</b><span>Aufträge</span></div><div class="tm-kpi"><b>${fmtEuro(total / Math.max(1, rows.length))}</b><span>Ø pro Person</span></div></div>
    <div class="tm-note" style="margin-top:8px;text-align:center">Prozent: heute im Vergleich zu gestern (<span style="color:var(--green);font-weight:700">grün = mehr</span>, <span style="color:var(--danger);font-weight:700">rot = weniger</span>).</div>`);
  html += card(`<h2 class="tm-h">Rangliste · ${periodName[P]}</h2><p class="tm-sub">${leader ? 'Tippe auf eine Person, um Details zu sehen.' : 'So steht dein Team gerade da.'}</p>${list}${team.err ? err : ''}`);
  html += teamRulesCard();
  html += teamEventsCard();
  if (leader && team.info) {
    html += card(`<h2 class="tm-h">Leute einladen</h2><p class="tm-sub">Schick diesen Link an dein Team. Wer ihn öffnet, registriert sich bzw. meldet sich an und kann dann beitreten.</p>
      <input class="tm-link" id="tm-link" readonly value="${escapeHtml(teamInviteLink())}" onclick="this.select()">
      <div class="tm-row" style="margin-top:10px"><button class="tm-btn" onclick="teamShareLink()">Link teilen</button><button class="tm-btn sec" onclick="teamCopyLink()">Link kopieren</button></div>${msg}`);
  }
  html += card(`<div class="tm-note" style="margin-bottom:10px">Stand der Zahlen: wird bei jeder Änderung automatisch aktualisiert. <button class="tm-btn danger" onclick="teamLoad()">Jetzt neu laden</button></div>
    ${leader ? (team.confirm === 'dissolve' ? `<span class="tm-note">Team wirklich auflösen? Alle Kennzahlen werden gelöscht. </span><button class="tm-btn danger" onclick="teamDissolve()">Ja, auflösen</button>` : `<button class="tm-btn danger" onclick="teamDissolve()">Team auflösen</button>`)
      : (team.confirm === 'leave' ? `<span class="tm-note">Team wirklich verlassen? </span><button class="tm-btn danger" onclick="teamLeave()">Ja, verlassen</button>` : `<button class="tm-btn danger" onclick="teamLeave()">Team verlassen</button>`)}`);
  return wrap(html);
}
window.teamCreate = teamCreate; window.teamJoin = teamJoin; window.teamLeave = teamLeave; window.teamDissolve = teamDissolve; window.teamRemove = teamRemove;
window.teamSetPeriod = teamSetPeriod; window.teamToggleOpen = teamToggleOpen; window.teamCopyLink = teamCopyLink; window.teamShareLink = teamShareLink;
window.teamDeclineInvite = teamDeclineInvite; window.teamLoad = teamLoad;

async function startApp() {
  gateOn = false;
  cl.loading = false;
  getGateRoot().innerHTML = '';
  const w = document.getElementById('wrap'); if (w) w.style.display = '';
  await loadData();
  render();
  updateHeaderGreeting();
  if (!settings.onboarded) openOnboarding('first');
  teamInit();
}

(async function init() {
  setupManifest();
  await loadTheme();
  profiles.active = 'main'; STORAGE_KEY = storageKeyFor('main');
  showGate();
  initCloud();
})();
</script>
</body>
</html>
