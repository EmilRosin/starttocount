// ---------- Reiter "Meine Abrechnungen": Jahresdiagramm + pro Monat ein Block + PDF ----------
let abrYear = new Date().getFullYear();
function shiftAbrYear(d) { abrYear += d; render(); }

const ABR_MONTHS = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const ABR_MONTHS_LONG = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

// Umsatzsteuer: ist der Betrag aus der Abrechnung inkl. 19 %, steckt darin Betrag − Betrag/1,19 (gehört dem Finanzamt)
function abrUst(total) { return settings.ustPflicht ? total - total / 1.19 : 0; }
function abrNet(total) { return nettoOf(total - abrUst(total)); }

function abrYearData(y) {
  return Array.from({ length: 12 }, (_, i) => {
    const mk = `${y}-${String(i + 1).padStart(2, '0')}`;
    const A = settlements.filter(x => x.windowId === mk + '-A');
    const B = settlements.filter(x => x.windowId === mk + '-B');
    const a = A.reduce((t, x) => t + (x.betrag || 0), 0);
    const b = B.reduce((t, x) => t + (x.betrag || 0), 0);
    return { mk, i, hasA: A.length > 0, hasB: B.length > 0, a, b, total: a + b, has: A.length + B.length > 0 };
  });
}

// Auswahl aller Abrechnungen (1. und 2. pro Monat) für die Zuordnung, neueste zuerst
function abrWindowOptions() {
  const now = new Date();
  const out = [];
  for (let y = now.getFullYear(); y >= now.getFullYear() - 3; y--) {
    const lastM = y === now.getFullYear() ? now.getMonth() : 11;
    for (let m = lastM; m >= 0; m--) {
      const mk = `${y}-${String(m + 1).padStart(2, '0')}`;
      const last = new Date(y, m + 1, 0).getDate();
      out.push(`<option value="${mk}-B">${ABR_MONTHS_LONG[m]} ${y} · Abrechnung 2 (16.–${last}.)</option>`);
      out.push(`<option value="${mk}-A">${ABR_MONTHS_LONG[m]} ${y} · Abrechnung 1 (1.–15.)</option>`);
    }
  }
  return out.join('');
}

function assignSettlementWindow(id, windowId) {
  const x = settlements.find(z => String(z.id) === String(id));
  if (!x || !windowId) return;
  x.windowId = windowId;
  saveData();
  render();
}

function abrNiceMax(v) {
  if (v <= 0) return 1000;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

function abrChartSvg(data) {
  const W = 720, H = 260, L = 58, R = 24, T = 28, B = 32;
  const iw = W - L - R, ih = H - T - B;
  const withTax = STEUER_PROZENT > 0;
  const max = abrNiceMax(Math.max(0, ...data.map(d => d.total)) * 1.08);
  const x = i => L + (iw * i) / 11;
  const y = v => T + ih - (ih * v) / max;
  const now = new Date();
  const curI = abrYear === now.getFullYear() ? now.getMonth() : -1;
  const best = data.reduce((b, d) => (d.has && (!b || d.total > b.total) ? d : b), null);
  const grid = [0, 1, 2, 3, 4].map(k => {
    const v = (max * k) / 4;
    return `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1" ${k ? 'stroke-dasharray="3 5"' : ''}/><text x="${L - 10}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-dim)">${Math.round(v).toLocaleString('de-DE')}</text>`;
  }).join('');
  const xl = data.map(d => `<text x="${x(d.i)}" y="${H - 10}" text-anchor="middle" font-size="11" font-weight="${d.i === curI ? 700 : 500}" fill="${d.i === curI ? 'var(--blue)' : 'var(--text-dim)'}">${ABR_MONTHS[d.i]}</text>`).join('');
  // Linie mit weichen Kurven (waagerechte Tangenten: kein Überschwingen), pro zusammenhängendem Abschnitt
  const runs = [];
  data.forEach(d => { if (d.has) { const r = runs[runs.length - 1]; if (r && r[r.length - 1].i === d.i - 1) r.push(d); else runs.push([d]); } });
  const curve = (run, fn) => run.map((d, k) => {
    const px = x(d.i), py = y(fn(d));
    if (!k) return `M${px.toFixed(1)} ${py.toFixed(1)}`;
    const q = run[k - 1], qx = x(q.i), qy = y(fn(q)), mx = (qx + px) / 2;
    return `C${mx.toFixed(1)} ${qy.toFixed(1)} ${mx.toFixed(1)} ${py.toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)}`;
  }).join(' ');
  const base = y(0);
  const area = runs.map(r => `<path d="${curve(r, d => d.total)} L${x(r[r.length - 1].i).toFixed(1)} ${base} L${x(r[0].i).toFixed(1)} ${base} Z" fill="url(#abrGrad)"/>`).join('');
  const lineBrutto = runs.map(r => `<path d="${curve(r, d => d.total)}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  const lineNetto = withTax ? runs.map(r => `<path d="${curve(r, d => abrNet(d.total))}" fill="none" stroke="var(--green)" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>`).join('') : '';
  const eur = v => Math.round(v).toLocaleString('de-DE') + ' €';
  const dots = data.filter(d => d.has).map(d => {
    const isBest = best && d.i === best.i;
    return `<g><title>${ABR_MONTHS_LONG[d.i]}: ${eur(d.total)}${withTax ? ' (ca. ' + eur(abrNet(d.total)) + ' netto)' : ''}</title>
      <circle cx="${x(d.i)}" cy="${y(d.total)}" r="${isBest ? 6 : 4.5}" fill="var(--card)" stroke="var(--blue)" stroke-width="${isBest ? 3 : 2.5}"/>
      ${withTax ? `<circle cx="${x(d.i)}" cy="${y(abrNet(d.total))}" r="3" fill="var(--green)"/>` : ''}</g>`;
  }).join('');
  const labels = data.filter(d => d.has).map(d => {
    const t = Math.round(d.total).toLocaleString('de-DE');
    const w = t.length * 6.6 + 14, isBest = best && d.i === best.i;
    return `<g><rect x="${x(d.i) - w / 2}" y="${y(d.total) - 31}" width="${w}" height="20" rx="10" fill="${isBest ? 'var(--blue)' : 'var(--card)'}" stroke="${isBest ? 'var(--blue)' : 'var(--border)'}"/><text x="${x(d.i)}" y="${y(d.total) - 17}" text-anchor="middle" font-size="11" font-weight="700" fill="${isBest ? '#fff' : 'var(--text)'}">${t}</text></g>`;
  }).join('');
  const any = data.some(d => d.has);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Verdienst pro Monat" style="display:block;max-width:100%;height:auto;max-height:300px;">
    <defs><linearGradient id="abrGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--blue)" stop-opacity="0.28"/><stop offset="100%" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xl}
    ${any ? `${area}${lineNetto}${lineBrutto}${dots}${labels}` : `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="13" fill="var(--text-dim)">Noch keine Abrechnungen in diesem Jahr</text>`}
  </svg>`;
}

function renderAbrechnungenContent() {
  const now = new Date();
  const y = abrYear;
  const data = abrYearData(y);
  const months = data.filter(d => d.has || (y === now.getFullYear() && d.i === now.getMonth()));
  const yearTotal = data.reduce((t, d) => t + d.total, 0);
  const blocks = months.slice().reverse().map(d => {
    const last = new Date(y, d.i + 1, 0).getDate();
    const parts = [
      { nr: 1, range: '1.–15.', has: d.hasA, sum: d.a },
      { nr: 2, range: `16.–${last}.`, has: d.hasB, sum: d.b },
    ];
    const rows = parts.map(p => `
      <div class="abr-row ${p.has ? '' : 'missing'}">
        <div>Abrechnung ${p.nr}<small>geschrieben ${p.range}</small></div>
        <b>${p.has ? fmtEuro(p.sum) : 'noch offen'}</b>
      </div>`).join('');
    return `
      <div class="card dash-card abr-month">
        <div class="dash-card-title">${ABR_MONTHS_LONG[d.i]} ${y}</div>
        ${rows}
        <div class="abr-sum"><span>Verdient im ${ABR_MONTHS_LONG[d.i]}</span><b>${d.has ? fmtEuro(d.total) : '–'}</b></div>
        ${d.has && settings.ustPflicht ? `<div class="abr-net">🏛️ darin Umsatzsteuer (19 %): ${fmtEuro(abrUst(d.total))} – ans Finanzamt</div>` : ''}
        ${d.has && STEUER_PROZENT > 0 ? `<div class="abr-net">≈ ${fmtEuro(abrNet(d.total))} netto (−${STEUER_PROZENT}% Steuer${settings.ustPflicht ? ', ohne USt' : ''})</div>` : ''}
      </div>`;
  }).join('');
  const loose = settlements.filter(x => !x.windowId || !/^\d{4}-\d{2}-[AB]$/.test(x.windowId));
  const looseHtml = loose.length ? `
      <div class="card dash-card abr-month">
        <div class="dash-card-title">Ohne Zeitraum</div>
        <div class="dash-card-sub">Diese Abrechnungen sind keinem Zeitraum zugeordnet und zählen deshalb in keinem Monat mit.</div>
        ${loose.map(x => `<div class="abr-row abr-loose"><div>${escapeHtml(x.label || 'Abrechnung')}<select class="abr-assign" onchange="assignSettlementWindow('${x.id}', this.value)"><option value="">Monat zuordnen …</option>${abrWindowOptions()}</select></div><b>${fmtEuro(x.betrag || 0)}</b></div>`).join('')}
      </div>` : '';
  return `
    <div class="abr-page">
      <div class="card dash-card abr-head">
        <div><div class="dash-card-title">Meine Abrechnungen</div><div class="dash-card-sub">Was dir pro Monat für die beiden Abrechnungen ausgezahlt wurde (Brutto).</div></div>
        <div class="abr-actions">
          <button class="today-btn" onclick="downloadAbrechnungenPdf()">📄 Als PDF herunterladen</button>
          <button class="today-btn" onclick="settlementsOpen = true; switchPage('dashboard')">➕ Abrechnung hinzufügen</button>
        </div>
      </div>
      <div class="card dash-card abr-chart">
        <div class="abr-chart-head">
          <div><div class="dash-card-title">Verdienst ${y}</div><div class="dash-card-sub">Gesamt ${fmtEuro(yearTotal)}${STEUER_PROZENT > 0 ? ` · ≈ ${fmtEuro(abrNet(yearTotal))} netto` : ''}</div></div>
          <div class="abr-year-nav">
            <button class="month-nav-arrow" onclick="shiftAbrYear(-1)" title="Vorheriges Jahr">‹</button>
            <b>${y}</b>
            <button class="month-nav-arrow" onclick="shiftAbrYear(1)" title="Nächstes Jahr" ${y >= now.getFullYear() ? 'disabled' : ''}>›</button>
          </div>
        </div>
        ${abrChartSvg(data)}
        <div class="abr-legend"><span><i style="background:var(--blue)"></i>Brutto</span>${STEUER_PROZENT > 0 ? `<span><i style="background:var(--green);height:4px;width:4px;border-radius:50%;box-shadow:6px 0 0 var(--green),12px 0 0 var(--green);margin-right:20px;"></i>Netto (−${STEUER_PROZENT}% Steuer)</span>` : ''}</div>
      </div>
      <div class="abr-grid">${blocks}${looseHtml}</div>
    </div>`;
}

// ---------- PDF-Export (ohne Bibliothek, funktioniert offline) ----------
function pdfEsc(str) {
  let o = '';
  for (const ch of String(str).replace(/[  ]/g, ' ')) {
    const c = ch.charCodeAt(0);
    let b = ch;
    if (ch === '€') b = '\x80';
    else if (ch === '–') b = '\x96';
    else if (ch === '−') b = '-';
    else if (c > 255) b = '?';
    if (b === '\\' || b === '(' || b === ')') b = '\\' + b;
    o += b;
  }
  return o;
}
function pdfEuro(n) { return Math.round(n).toLocaleString('de-DE').replace(/[  ]/g, ' ') + ' €'; }
function pdfTextW(str, size) {
  let w = 0;
  for (const ch of String(str)) w += (ch === ' ' || ch === '.' || ch === ',' ? 0.278 : ch === '1' ? 0.556 : 0.556) * size;
  return w;
}

async function downloadAbrechnungenPdf() {
  const y = abrYear;
  const data = abrYearData(y);
  const withTax = STEUER_PROZENT > 0;
  const ops = [];
  const text = (str, x, yy, size, bold, rightAlign, rgb) => {
    const xx = rightAlign ? x - pdfTextW(str, size) : x;
    ops.push(`${(rgb || [0.1, 0.12, 0.16]).join(' ')} rg BT /${bold ? 'F2' : 'F1'} ${size} Tf ${xx.toFixed(2)} ${yy.toFixed(2)} Td (${pdfEsc(str)}) Tj ET`);
  };
  const line = (x1, y1, x2, y2, rgb, w, dash) => ops.push(`${rgb.join(' ')} RG ${w} w ${dash ? '[4 3] 0 d' : '[] 0 d'} ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
  const circle = (cx, cy, r, rgb) => {
    const k = 0.5523 * r;
    ops.push(`${rgb.join(' ')} rg ${(cx + r).toFixed(2)} ${cy.toFixed(2)} m ${(cx + r).toFixed(2)} ${(cy + k).toFixed(2)} ${(cx + k).toFixed(2)} ${(cy + r).toFixed(2)} ${cx.toFixed(2)} ${(cy + r).toFixed(2)} c ${(cx - k).toFixed(2)} ${(cy + r).toFixed(2)} ${(cx - r).toFixed(2)} ${(cy + k).toFixed(2)} ${(cx - r).toFixed(2)} ${cy.toFixed(2)} c ${(cx - r).toFixed(2)} ${(cy - k).toFixed(2)} ${(cx - k).toFixed(2)} ${(cy - r).toFixed(2)} ${cx.toFixed(2)} ${(cy - r).toFixed(2)} c ${(cx + k).toFixed(2)} ${(cy - r).toFixed(2)} ${(cx + r).toFixed(2)} ${(cy - k).toFixed(2)} ${(cx + r).toFixed(2)} ${cy.toFixed(2)} c f`);
  };
  const BLUE = [0.16, 0.35, 0.9], GREEN = [0.09, 0.64, 0.29], GREY = [0.55, 0.58, 0.64], LIGHT = [0.87, 0.89, 0.92];

  // Kopf
  text('Meine Abrechnungen ' + y, 50, 790, 20, true);
  const who = settings.name ? settings.name + ' · ' : '';
  text(who + 'erstellt am ' + new Date().toLocaleDateString('de-DE') + ' · Start (to) count', 50, 772, 9, false, false, GREY);

  // Diagramm
  const x0 = 90, x1 = 545, yTop = 730, yBot = 560;
  const max = abrNiceMax(Math.max(0, ...data.map(d => d.total)));
  const px = i => x0 + ((x1 - x0) * i) / 11;
  const py = v => yBot + ((yTop - yBot) * v) / max;
  for (let k = 0; k <= 4; k++) {
    const v = (max * k) / 4;
    line(x0, py(v), x1, py(v), LIGHT, 0.6);
    text(pdfEuro(v), x0 - 6, py(v) - 3, 8, false, true, GREY);
  }
  data.forEach(d => text(ABR_MONTHS[d.i], px(d.i), yBot - 14, 8, false, false, GREY));
  const seg = (fn, rgb, w, dash) => {
    for (let i = 0; i < 11; i++) if (data[i].has && data[i + 1].has) line(px(i), py(fn(data[i])), px(i + 1), py(fn(data[i + 1])), rgb, w, dash);
  };
  seg(d => d.total, BLUE, 1.8);
  if (withTax) seg(d => abrNet(d.total), GREEN, 1.4, true);
  data.filter(d => d.has).forEach(d => {
    if (withTax) circle(px(d.i), py(abrNet(d.total)), 2.4, GREEN);
    circle(px(d.i), py(d.total), 2.8, BLUE);
    text(Math.round(d.total).toLocaleString('de-DE'), px(d.i) - pdfTextW(Math.round(d.total).toLocaleString('de-DE'), 7) / 2, py(d.total) + 6, 7, true);
  });
  circle(x0 + 4, yTop + 14, 3, BLUE); text('Brutto', x0 + 12, yTop + 11, 8, false, false, GREY);
  if (withTax) { circle(x0 + 60, yTop + 14, 3, GREEN); text('Netto (−' + STEUER_PROZENT + '% Steuer)', x0 + 68, yTop + 11, 8, false, false, GREY); }

  // Tabelle
  let ty = 520;
  const cA = 235, cB = 320, cT = 410, cN = 500;
  text('Monat', 50, ty, 9, true, false, GREY);
  text('Abrechnung 1', cA, ty, 9, true, true, GREY);
  text('Abrechnung 2', cB, ty, 9, true, true, GREY);
  text(withTax ? 'Brutto' : 'Verdient', cT + 40, ty, 9, true, true, GREY);
  if (withTax) text('Netto ca.', cN + 45, ty, 9, true, true, GREY);
  ty -= 6; line(50, ty, 545, ty, GREY, 0.8); ty -= 16;
  data.filter(d => d.has).forEach(d => {
    text(ABR_MONTHS_LONG[d.i], 50, ty, 10, false);
    text(d.hasA ? pdfEuro(d.a) : 'offen', cA, ty, 10, false, true, d.hasA ? undefined : GREY);
    text(d.hasB ? pdfEuro(d.b) : 'offen', cB, ty, 10, false, true, d.hasB ? undefined : GREY);
    text(pdfEuro(d.total), cT + 40, ty, 10, true, true);
    if (withTax) text(pdfEuro(abrNet(d.total)), cN + 45, ty, 10, false, true);
    ty -= 6; line(50, ty, 545, ty, LIGHT, 0.5); ty -= 16;
  });
  const total = data.reduce((t, d) => t + d.total, 0);
  line(50, ty + 10, 545, ty + 10, GREY, 1);
  text('Summe ' + y, 50, ty - 6, 11, true);
  text(pdfEuro(total), cT + 40, ty - 6, 11, true, true);
  if (withTax) text(pdfEuro(abrNet(total)), cN + 45, ty - 6, 11, true, true);
  if (settings.ustPflicht) text('Darin enthaltene Umsatzsteuer (19 %): ' + pdfEuro(abrUst(total)) + ' – ans Finanzamt weiterleiten', 50, ty - 24, 9, false, false, GREY);
  text('Beträge sind die ausgezahlten Brutto-Beträge aus deinen Abrechnungen.' + (withTax ? ' Netto = abzüglich ' + STEUER_PROZENT + '% Steuer (Schätzung).' : ''), 50, 40, 8, false, false, GREY);

  const content = ops.join('\n');
  const objs = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>',
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
  ];
  let pdf = '%PDF-1.4\n';
  const offs = [];
  objs.forEach((o, i) => { offs.push(pdf.length); pdf += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
  pdf += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes = new Uint8Array(pdf.length);
  for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 255;
  const blob = new Blob([bytes], { type: 'application/pdf' });
  // Im Claude-Artifact-Viewer: Speichern über die Download-Funktion der Plattform
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename: `Meine-Abrechnungen-${y}.pdf`, data: blob }); return; }
    }
  } catch (e) { if (e && e.code === 'declined') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Meine-Abrechnungen-${y}.pdf`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

let lastRenderedPage = null;

function render() {
  let html = '';

  if (currentPage === 'dashboard') {
    const enteringDashboard = lastRenderedPage !== 'dashboard';
    html += renderDashboardContent(buildStatsData(), enteringDashboard);
  } else if (currentPage === 'abrechnungen') {
    html += renderAbrechnungenContent();
  } else {
    html += renderTrackerContent();
  }

  document.getElementById('app').innerHTML = html;
  lastRenderedPage = currentPage;

  const wrapEl = document.getElementById('wrap');
  if (wrapEl) wrapEl.classList.toggle('wrap-wide', currentPage === 'dashboard' || currentPage === 'abrechnungen');

  if (currentPage === 'tracker') {
    const dp = document.getElementById('datePicker');
    if (dp) dp.addEventListener('change', (e) => {
      selectedDate = e.target.value || todayKey();
      render();
    });
  }

  updateNavTabs();
  updatePeriodToggle();
  updateMonthNav();
  updateZeitraumInfo();
  updateJahrNav();
  updateHeaderGreeting();
}

function updateMonthNav() {
  const root = document.getElementById('month-nav-root');
  if (!root) return;
  const show = currentPage === 'dashboard' && statsPeriod === 'monat' && dashboardView !== 'ausgezahlt';
  root.style.display = show ? '' : 'none';

  const label = document.getElementById('month-nav-label');
  if (label) label.textContent = monthOffsetLabel(monatOffset);
  const nextBtn = document.getElementById('month-nav-next');
  if (nextBtn) nextBtn.disabled = monatOffset === 0;
}

function updateZeitraumInfo() {
  const root = document.getElementById('zeitraum-info-root');
  if (!root) return;

  root.style.display = show ? '' : 'none';

function updateJahrNav() {

  root.style.display = show ? '' : 'none';

function updateNavTabs() {
  const tabTracker = document.getElementById('tab-tracker');
  const tabDashboard = document.getElementById('tab-dashboard');
  const tabAbr = document.getElementById('tab-abrechnungen');
  if (!tabTracker || !tabDashboard) return;
  tabTracker.classList.toggle('active', currentPage === 'tracker');
  tabDashboard.classList.toggle('active', currentPage === 'dashboard');
  if (tabAbr) tabAbr.classList.toggle('active', currentPage === 'abrechnungen');
  const map = { tracker: tabTracker, dashboard: tabDashboard, abrechnungen: tabAbr };
  positionSlider('nav-slider', map[currentPage]);
}

function updatePeriodToggle() {
  const root = document.getElementById('period-toggle-root');
  if (!root) return;
  // In der Ausgezahlt-Ansicht des Dashboards ergibt Woche/Monat/Gesamt keinen Sinn,
  // da Abrechnungen nicht nach diesen Zeiträumen gefiltert werden.
  const showsPeriod = currentPage === 'dashboard' && dashboardView !== 'ausgezahlt';
  root.style.display = showsPeriod ? '' : 'none';
  if (!showsPeriod) return;
  const btnWoche = document.getElementById('btn-woche');
  const btnMonat = document.getElementById('btn-monat');
  const btnGesamt = document.getElementById('btn-gesamt');
  if (!btnWoche || !btnMonat || !btnGesamt) return;
  btnWoche.classList.toggle('active', statsPeriod === 'woche');
  btnMonat.classList.toggle('active', statsPeriod === 'monat');
  btnGesamt.classList.toggle('active', statsPeriod === 'gesamt');
  const activeBtn = statsPeriod === 'woche' ? btnWoche : (statsPeriod === 'monat' ? btnMonat : btnGesamt);
  positionSlider('period-slider', activeBtn);
}

function positionSlider(sliderId, activeBtn) {
  const slider = document.getElementById(sliderId);
  if (!slider || !activeBtn) return;
  slider.style.width = activeBtn.offsetWidth + 'px';
  slider.style.transform = 'translateX(' + activeBtn.offsetLeft + 'px)';
}

async function applyTheme(theme) {
  document.body.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}

async function toggleTheme() {
  const current = document.body.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  await applyTheme(next);
  const btn = document.getElementById('themeToggle');
  if (btn) {
    btn.classList.remove('spin');
    void btn.offsetWidth;
    btn.classList.add('spin');
  }
  try {
    localStorage.setItem(THEME_KEY, next);
  } catch (e) { /* Präferenz konnte nicht gespeichert werden, gilt nur für diese Sitzung */ }
  render();
}

async function loadTheme() {
  let theme = 'light';
  try {
    const stored = localStorage.getItem(THEME_KEY);
    if (stored === 'dark' || stored === 'light') theme = stored;
  } catch (e) { /* kein gespeichertes Theme, Standard bleibt light */ }
  await applyTheme(theme);
}

// ===== Onboarding / Einstellungen =====
// Mehrstufiger Dialog: Willkommen -> Rolle -> Provision -> (Overhead, nur Teamleiter) -> Details -> Fertig.
// Beim ersten Öffnen automatisch (mode 'first'), später über das Zahnrad im Header (mode 'edit').
let ob = null;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function parseNum(v) {
  if (v === null || v === undefined) return NaN;
  const s = String(v).trim().replace(',', '.');
  if (s === '') return NaN;
  return Number(s);
}

function fmtNumInput(n) {
  return String(n).replace('.', ',');
}

function fmtNumPlain(n) {
  return (Math.round(n * 100) / 100).toLocaleString('de-DE', { maximumFractionDigits: 2 }) + ' €';
}

function obSteps() {
  return ob && ob.role === 'teamleiter'
    ? ['welcome', 'prinzip', 'rolle', 'provision', 'overhead', 'weiteres', 'fertig']
    : ['welcome', 'prinzip', 'rolle', 'provision', 'weiteres', 'fertig'];
}
// Im Bearbeiten-Modus (⚙️) startet der Dialog direkt bei der Rolle
function obFirstStep() { return ob && ob.mode !== 'first' ? 2 : 0; }

function getObRoot() {
  let root = document.getElementById('onboarding-root');
  if (!root) {
    root = document.createElement('div');
    root.id = 'onboarding-root';
    document.body.appendChild(root);
  }
  return root;
}

function openOnboarding(mode) {
  const edit = mode === 'edit' || mode === 'settings';
  // Wer die App schon mit Daten nutzt, bekommt seine bisherigen Werte vorausgefüllt
  const hasData = Object.keys(data).length > 0 || settlements.length > 0 || settings.fixkosten > 0;
  const prefill = edit || hasData;
  ob = {
    mode: mode === 'settings' ? 'settings' : edit ? 'edit' : 'first',
    step: edit ? 2 : 0,
    name: settings.name || '',
    role: settings.role === 'teamleiter' ? 'teamleiter' : 'vertreter',
    // Beim ersten Mal bewusst leer, damit jeder SEINE Provision eintippt (statt Standardwerte zu übernehmen)
    preisNeu: prefill ? fmtNumInput(settings.preisNeu) : '',
    preisBestand: prefill ? fmtNumInput(settings.preisBestand) : '',
    // Steuersatz ist optional: leer = keine Netto-/Steuer-Anzeige. Bei 0 bleibt das Feld ebenfalls leer.
    steuer: !prefill ? '' : (settings.steuer > 0 ? fmtNumInput(settings.steuer) : ''),
    fixkosten: settings.fixkosten ? fmtNumInput(settings.fixkosten) : '',
    ust: !!settings.ustPflicht,
    stornoAufschlag: !!settings.stornoAufschlag,
    runden: !!settings.zielAufrunden,
    goalName: settings.goalName || '',
    mine: settings.mineAmount ? fmtNumInput(settings.mineAmount) : '',
    goalAmount: settings.goalAmount ? fmtNumInput(settings.goalAmount) : '',
    goalPeriod: goalPeriodOf(settings.goalPeriod),
    goalCount: String(goalCountOf(settings.goalCount)),
    goalUnit: goalUnitOf(settings.goalUnit),
    goalStart: settings.goalStart || '',
    overheadNeu: settings.overheadNeu ? fmtNumInput(settings.overheadNeu) : '',
    error: ''
  };
  renderOnboarding();
}

function closeOnboarding() {
  const root = getObRoot();
  root.innerHTML = '';
  ob = null;
}

function obSet(field, value) {
  if (!ob) return;
  ob[field] = value;
  ob.error = '';
  if (ob.mode === 'settings') {
    const el = document.getElementById('ob-breakdown');
    if (el) el.innerHTML = obBreakdownInner();
  }
}

function obSetRunden(on) { obSet('runden', !!on); }

// Live-Aufschlüsselung des Brutto-Ziels aus den Werten im Einstellungs-Dialog
function obBreakdownInner() {
  const per = goalPeriodOf(ob.goalPeriod);
  const amt = Math.max(0, parseNum(ob.goalAmount) || 0);
  const monthly = per === 'woche' ? amt * 52 / 12 : per === 'jahr' ? amt / 12
    : per === 'custom' ? amt / goalCustomMonths(ob.goalCount, ob.goalUnit) : amt;
  const stPct = ob.stornoAufschlag ? avgStornoQuote().pct : 0;
  const taxPct = Math.max(0, parseNum(ob.steuer) || 0);
  const a = zielAufbauCalc({
    fix: Math.max(0, parseNum(ob.fixkosten) || 0),
    goal: monthly / 2,
    mine: Math.max(0, parseNum(ob.mine) || 0) / 2,
    taxPct, stornoPct: stPct, runden: !!ob.runden,
  });
  const gname = String(ob.goalName || '').trim();
  return a.total > 0 ? `
    ${a.fix > 0 ? `<div><span>Fixkosten</span><b>${fmtEuro(a.fix)}</b></div>` : ''}
    ${a.mine > 0 ? `<div><span>Nur für mich übrig (Monatsbetrag ÷ 2)</span><b>+ ${fmtEuro(a.mine)}</b></div>` : ''}
    ${a.goal > 0 ? `<div><span>Persönliches Ziel${gname ? ' (' + escapeHtml(gname) + ')' : ''}</span><b>+ ${fmtEuro(a.goal)}</b></div>` : ''}
    ${taxPct > 0 ? `<div><span>Steuer (+${taxPct}%)</span><b>+ ${fmtEuro(a.tax)}</b></div>` : ''}
    ${stPct > 0 ? `<div><span>Storno-Puffer (+${fmtPct(stPct)})</span><b>+ ${fmtEuro(a.storno)}</b></div>` : ''}
    ${a.round > 0.005 ? `<div><span>Aufgerundet (auf volle 10 €)</span><b>+ ${fmtEuro(a.round)}</b></div>` : ''}
    <div class="sum"><span>= Brutto-Ziel pro Abrechnungsperiode</span><b>${fmtEuro(a.total)}</b></div>`
    : '<div><span>Trag oben Fixkosten, Ziel oder „Nur für mich übrig“ ein – dann siehst du hier dein Brutto-Ziel.</span></div>';
}

function obSetChip(field, value) {
  obSet(field, value);
  renderOnboarding();
}

function obSetUst(on) {
  if (!ob) return;
  ob.ust = !!on;
  renderOnboarding();
}

function obToggleRunden() {
  if (!ob) return;
  ob.runden = !ob.runden;
  renderOnboarding();
}

function obSetRole(role) {
  obSet('role', role);
  renderOnboarding();
}

function obValidateStep() { return obValidate(obSteps()[ob.step]); }

function obValidate(step) {
  if (step === 'provision') {
    const n = parseNum(ob.preisNeu), b = parseNum(ob.preisBestand);
    if (!(n >= 0) || !(b >= 0)) return 'Bitte gib beide Beträge in € ein (z. B. 110 und 15).';
  }
  if (step === 'overhead') {
    const n = parseNum(ob.overheadNeu);
    if (!(n >= 0)) return 'Bitte gib den Overhead pro Neukunden-Auftrag in € ein.';
  }
  if (step === 'weiteres') {
    if (String(ob.steuer).trim() !== '') {
      const s = parseNum(ob.steuer);
      if (!(s >= 0 && s < 100)) return 'Der Steuersatz muss zwischen 0 und 99 % liegen (oder leer bleiben).';
    }
    if (String(ob.fixkosten).trim() !== '' && !(parseNum(ob.fixkosten) >= 0)) return 'Die Fixkosten müssen eine Zahl sein (oder leer bleiben).';
    if (String(ob.mine).trim() !== '' && !(parseNum(ob.mine) >= 0)) return 'Der Betrag „nur für mich“ muss eine Zahl sein (oder leer bleiben).';
    if (String(ob.goalAmount).trim() !== '' && !(parseNum(ob.goalAmount) >= 0)) return 'Das Finanzziel muss eine Zahl sein (oder leer bleiben).';
  }
  return '';
}

function obNext() {
  if (!ob) return;
  const err = obValidateStep();
  if (err) { ob.error = err; renderOnboarding(); return; }
  const steps = obSteps();
  if (ob.step < steps.length - 1) ob.step++;
  renderOnboarding();
}

function obBack() {
  if (!ob) return;
  const min = obFirstStep();
  if (ob.step > min) ob.step--;
  ob.error = '';
  renderOnboarding();
}

async function obFinish() {
  if (!ob) return;
  settings.name = String(ob.name || '').trim().slice(0, 40);
  if (settings.name) {
    const ap = activeProfile();
    if (ap && !profiles.list.some(p => p !== ap && p.name.toLowerCase() === settings.name.toLowerCase())) { ap.name = settings.name; saveProfiles(); }
  }
  settings.role = ob.role === 'teamleiter' ? 'teamleiter' : 'vertreter';
  settings.preisNeu = parseNum(ob.preisNeu) >= 0 ? parseNum(ob.preisNeu) : settings.preisNeu;
  settings.preisBestand = parseNum(ob.preisBestand) >= 0 ? parseNum(ob.preisBestand) : settings.preisBestand;
  settings.steuer = parseNum(ob.steuer) >= 0 && parseNum(ob.steuer) < 100 ? parseNum(ob.steuer) : 0; // leer = keine Steuer
  settings.fixkosten = parseNum(ob.fixkosten) >= 0 ? parseNum(ob.fixkosten) : 0;
  settings.stornoAufschlag = !!ob.stornoAufschlag;
  settings.ustPflicht = !!ob.ust;
  settings.zielAufrunden = !!ob.runden;
  settings.goalName = String(ob.goalName || '').trim().slice(0, 40);
  settings.mineAmount = parseNum(ob.mine) >= 0 ? parseNum(ob.mine) : 0;
  settings.goalAmount = parseNum(ob.goalAmount) >= 0 ? parseNum(ob.goalAmount) : 0;
  settings.goalPeriod = goalPeriodOf(ob.goalPeriod);
  settings.goalCount = goalCountOf(ob.goalCount);
  settings.goalUnit = goalUnitOf(ob.goalUnit);
  settings.goalStart = settings.goalPeriod === 'custom' ? (/^\d{4}-\d{2}-\d{2}$/.test(ob.goalStart) ? ob.goalStart : (settings.goalStart || todayKey())) : (settings.goalStart || '');
  settings.overheadNeu = parseNum(ob.overheadNeu) >= 0 ? parseNum(ob.overheadNeu) : 0;
  settings.onboarded = true;
  applySettings();
  await saveData();
  closeOnboarding();
  render();
  checkFireworksTrigger();
}

// ---------- Einstellungen: alles auf einer Seite bearbeiten ----------
function openSettings() { openOnboarding('settings'); }

function obSaveSettings() {
  if (!ob) return;
  const toCheck = ['provision'].concat(ob.role === 'teamleiter' ? ['overhead'] : []).concat(['weiteres']);
  for (const st of toCheck) {
    const err = obValidate(st);
    if (err) { ob.error = err; renderSettingsPage(); return; }
  }
  obFinish();
}

    const obPeriod = goalPeriodOf(ob.goalPeriod);
    const obGoalAmt = Math.max(0, parseNum(ob.goalAmount) || 0);
    const obGoalMonthly = obPeriod === 'woche' ? obGoalAmt * 52 / 12 : obPeriod === 'jahr' ? obGoalAmt / 12
      : obPeriod === 'custom' ? obGoalAmt / goalCustomMonths(ob.goalCount, ob.goalUnit) : obGoalAmt;
    const obAufbau = zielAufbauCalc({
      fix: Math.max(0, parseNum(ob.fixkosten) || 0),
      goal: obGoalMonthly / 2,
      mine: Math.max(0, parseNum(ob.mine) || 0) / 2,
      taxPct: Math.max(0, parseNum(ob.steuer) || 0),
      stornoPct: ob.stornoAufschlag ? avgStornoQuote().pct : 0,
      runden: !!ob.runden,
    });
    const roundBtn = obAufbau.raw > 0
      ? `<button type="button" class="ob-round ${ob.runden ? 'active' : ''}" onclick="obToggleRunden()">${ob.runden ? '✓ Aufgerundet' : '⬆️ Aufrunden'}</button>` : '';
    rows.push(['Brutto-Ziel pro Abrechnungsperiode', obAufbau.total > 0 ? fmtEuro(obAufbau.total) + roundBtn : '–']);
    body = `
      <h2 class="ob-title">${edit ? 'Alles korrekt?' : 'Alles bereit!'}</h2>
      <p class="ob-sub">${edit ? 'Prüfe deine Angaben und speichere sie.' : 'Das hast du eingestellt – du kannst es jederzeit über das ⚙️ oben rechts ändern.'}</p>
      <div class="ob-summary">${rows.map(r => `<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`;
  }
  return { body, primaryLabel, primaryAction };
}

function renderOnboarding() {
  if (!ob) return;
  if (ob.mode === 'settings') { renderSettingsPage(); return; }
  const steps = obSteps();
  const step = steps[ob.step];
  const edit = ob.mode !== 'first';
  const dots = steps.map((s, i) => `<div class="ob-dot ${i <= ob.step ? 'done' : ''}"></div>`).join('');
  const { body, primaryLabel, primaryAction } = obStepContent(step);

  const showBack = ob.step > obFirstStep();
  const root = getObRoot();
  root.innerHTML = `
    <div class="ob-overlay">
      <div class="card ob-card">
        <div class="ob-dots">${dots}</div>
        ${body}
        <div class="ob-error">${ob.error ? escapeHtml(ob.error) : ''}</div>
        <div class="ob-actions">
          ${showBack ? '<button type="button" class="ob-btn secondary" onclick="obBack()">Zurück</button>' : ''}
          <button type="button" class="ob-btn" onclick="${primaryAction}">${primaryLabel}</button>
        </div>
        ${edit ? '<button type="button" class="ob-link" onclick="closeOnboarding()">Abbrechen</button>' : ''}
        ${!edit && step === 'welcome' ? '<button type="button" class="ob-link" onclick="obSkip()">Später einrichten (Standardwerte)</button>' : ''}
      </div>
    </div>`;
}

function updateHeaderGreeting() {
  const el = document.getElementById('header-eyebrow');
  if (!el) return;
  const role = isTeamleiter() ? 'Teamleiter' : 'Vertreter';
  el.textContent = settings.name ? `Hi ${settings.name} · ${role}` : 'Energie Direktvertrieb';
  const pb = document.getElementById('profileBtn');
  if (pb) pb.title = 'Profil: ' + activeProfile().name;
}

// ---------- Profile (mehrere Konten auf einem Gerät, nur mit Namen) ----------
let pf = null; // { newName, error, confirmDelete }

function getPfRoot() {
  let root = document.getElementById('profile-root');
  if (!root) {
    root = document.createElement('div');
    root.id = 'profile-root';
    document.body.appendChild(root);
  }
  return root;
}

function openProfiles() { loadProfiles(); pf = { newName: '', error: '', confirmDelete: null }; renderProfiles(); }
function closeProfiles() { pf = null; getPfRoot().innerHTML = ''; }

function renderProfiles() {
  if (!pf) return;
  const rows = profiles.list.map(p => {
    const active = p.id === profiles.active;
    const confirming = pf.confirmDelete === p.id;
    return `<div class="pf-row ${active ? 'active' : ''}">
      <button type="button" class="pf-main" onclick="switchProfile('${p.id}')">
        <span class="pf-avatar">${escapeHtml((p.name[0] || '?').toUpperCase())}</span>
        <span class="pf-name">${escapeHtml(p.name)}${p.id === 'main' ? '<small>Hauptprofil</small>' : ''}</span>
        ${active ? '<span class="pf-badge">aktiv</span>' : ''}
      </button>
      ${p.id === 'main' ? '' : (confirming
        ? `<button type="button" class="pf-del confirm" onclick="deleteProfile('${p.id}')">Wirklich löschen?</button>`
        : `<button type="button" class="pf-del" onclick="pfAskDelete('${p.id}')" title="Profil löschen">🗑️</button>`)}
    </div>`;
  }).join('');
  getPfRoot().innerHTML = `
    <div class="ob-overlay" onclick="if(event.target===this)closeProfiles()">
      <div class="ob-card card">
        <h2 class="ob-title">Profile</h2>
        <p class="ob-sub">Jedes Profil hat seine eigenen Zahlen und Einstellungen – ideal zum Ausprobieren wie ein neuer Nutzer. Alles bleibt auf diesem Gerät.</p>
        <div class="pf-list">${rows}</div>
        <label class="ob-field"><span>Neues Profil anlegen</span>
          <input class="ob-input" type="text" id="pf-new" maxlength="40" placeholder="Name" value="${escapeHtml(pf.newName)}"
            oninput="pf.newName=this.value;pf.error=''" onkeydown="if(event.key==='Enter')createProfile()"></label>
        ${pf.error ? `<div class="ob-error">${escapeHtml(pf.error)}</div>` : ''}
        <div class="ob-actions">
          <button type="button" class="ob-btn secondary" onclick="closeProfiles()">Schließen</button>
          <button type="button" class="ob-btn" onclick="createProfile()">Anlegen & starten</button>
        </div>
      </div>
    </div>`;
}

function pfAskDelete(id) { pf.confirmDelete = id; renderProfiles(); }

function activateProfile(id) {
  profiles.active = id;
  saveProfiles();
  STORAGE_KEY = storageKeyFor(id);
  selectedDate = todayKey();
  monatOffset = 0; zeitraumOffset = 0; jahrOffset = 0;
  statsPeriod = 'woche'; dashboardView = 'brutto'; settlementsOpen = false;
  currentPage = 'dashboard';
  closeProfiles();
  loadData();
  render();
  updateHeaderGreeting();
  if (!settings.onboarded) openOnboarding('first');
}

function switchProfile(id) {
  if (id === profiles.active) { closeProfiles(); return; }
  activateProfile(id);
}

function createProfile() {
  const name = String((pf && pf.newName) || '').trim().slice(0, 40);
  if (!name) { pf.error = 'Bitte gib einen Namen ein.'; renderProfiles(); return; }
  if (profiles.list.some(p => p.name.toLowerCase() === name.toLowerCase())) { pf.error = 'Dieser Name ist schon vergeben.'; renderProfiles(); return; }
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  profiles.list.push({ id, name });
  activateProfile(id);
}

function deleteProfile(id) {
  if (id === 'main') return;
  try { localStorage.removeItem(storageKeyFor(id)); } catch (e) { /* ignorieren */ }
  profiles.list = profiles.list.filter(p => p.id !== id);
  const wasActive = profiles.active === id;
  saveProfiles();
  if (wasActive) { activateProfile('main'); return; }
  pf.confirmDelete = null;
  renderProfiles();
}

(async function init() {
  setupManifest();
  await loadTheme();
  await loadData();
  render();
  if (!settings.onboarded) openOnboarding('first');
})();
</script>
</body>
</html>
