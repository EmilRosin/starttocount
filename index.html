<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --border: #e7e9f1;
    --text: #0f1730;
    --text-dim: #6b7280;
    --text-faint: #9aa1b3;
    --blue: #2954e2;
    --blue-soft: #e8edfd;
    --green: #16a34a;
    --green-soft: #e4f7eb;
    --violet: #7c5cfc;
    --violet-soft: #efecff;
    --danger: #ef4444;
    --danger-soft: #fde8e8;
    --flat-soft: #f1f2f6;
    --toggle-bg: #eef0f8;
    --row-hover: #f8f9fd;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(15,23,48,0.04), 0 4px 14px rgba(15,23,48,0.05);
  }

  body[data-theme="dark"] {
    --bg: #0b0e1a;
    --card: #141829;
    --border: #262b42;
    --text: #eef1f8;
    --text-dim: #9aa1b8;
    --text-faint: #6b7290;
    --blue: #6f8dff;
    --blue-soft: rgba(111,141,255,0.18);
    --green: #3ecb7a;
    --green-soft: rgba(62,203,122,0.16);
    --violet: #a68cff;
    --violet-soft: rgba(166,140,255,0.18);
    --danger: #ff6b6b;
    --danger-soft: rgba(255,107,107,0.16);
    --flat-soft: #1c2138;
    --toggle-bg: #1c2138;
    --row-hover: #181c30;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 4px 16px rgba(0,0,0,0.35);
  }

  body { transition: background 0.2s ease, color 0.2s ease; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(60px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 520px; margin: 0 auto; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-icon {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--blue);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 14px; font-weight: 800;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .eyebrow { font-size: 11px; color: var(--text-faint); font-weight: 500; }

  .theme-toggle {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
    transition: transform 0.1s ease, background 0.2s ease, border-color 0.2s ease;
    flex-shrink: 0;
  }
  .theme-toggle:active { transform: scale(0.9); }
  .theme-toggle.spin { animation: spinOnce 0.4s ease; }
  @keyframes spinOnce {
    from { transform: rotate(0deg) scale(0.85); }
    to { transform: rotate(180deg) scale(1); }
  }

  /* --- NAV TABS --- */
  .nav-tabs {
    display: flex;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    position: relative;
  }
  .toggle-slider {
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 0;
    width: calc(33.333% - 6px);
    transform: translateX(4px);
    background: var(--blue);
    border-radius: 7px;
    z-index: 0;
    transition: transform 0.28s cubic-bezier(0.34, 1.2, 0.64, 1), width 0.28s cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  .nav-tab {
    flex: 1;
    border: none;
    background: transparent;
    padding: 9px 0;
    border-radius: 7px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.18s ease;
    position: relative;
    z-index: 1;
  }
  .nav-tab.active { color: #fff; }
  .nav-tab { padding-left:4px; padding-right:4px; white-space:nowrap; }
  .abr-month { margin-bottom:0; }
  .abr-head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .abr-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .abr-chart { margin-bottom:16px; }
  .abr-loose > div { text-align:left; flex:1; min-width:0; }
  .abr-assign { display:block; margin-top:6px; width:100%; max-width:260px; padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:var(--bg-soft, var(--card)); color:var(--text); font:inherit; font-size:12px; }
  .abr-chart-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:8px; }
  .abr-chart-head > div:first-child, .abr-head > div:first-child { text-align:left; }
  .abr-year-nav { display:flex; align-items:center; gap:8px; }
  .abr-legend { display:flex; gap:16px; justify-content:center; font-size:12px; color:var(--text-dim); margin-top:6px; }
  .abr-legend i { display:inline-block; width:12px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .abr-grid { display:grid; grid-template-columns:1fr; gap:16px; align-items:start; }
  @media (min-width: 900px) { .abr-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1100px) { .abr-grid { grid-template-columns: repeat(3, 1fr); } }
  .abr-row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
  .abr-row small { display:block; color:var(--text-dim); font-size:12px; margin-top:2px; }
  .abr-row > div { text-align:left; }
  .abr-sum span { white-space:nowrap; }
  .abr-row b { color:var(--text); font-variant-numeric:tabular-nums; font-size:16px; white-space:nowrap; }
  .abr-row.missing b { color:var(--text-dim) !important; font-weight:600; font-size:13px; }
  .abr-sum { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:12px 0 2px; border-top:1.5px solid var(--text-dim); margin-top:2px; }
  .abr-sum span { font-weight:800; }
  .abr-sum b { font-family:'Space Grotesk',sans-serif; font-size:22px; color:var(--green); white-space:nowrap; }
  .dash-fix-reserve .ust-row { border-top:1px dashed var(--border); margin-top:6px; padding-top:6px; color:var(--text-dim); }
  .abr-net { color:var(--text-dim); font-size:12.5px; text-align:right; }

  /* --- MAIN CARD --- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .stats-page.animate-in .card {
    animation: fadeInUp 0.32s ease both;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.3); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }

  .meter {
    padding: 18px 18px 14px;
    margin-bottom: 14px;
  }

  .meter-label {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
    margin-bottom: 8px;
  }

  .meter-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

  .meter-display {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
    line-height: 1;
  }

  .trend {
    font-size: 12px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .trend.up { color: var(--green); background: var(--green-soft); }
  .trend.down { color: var(--danger); background: var(--danger-soft); }
  .trend.flat { color: var(--text-faint); background: var(--flat-soft); }

  .meter-sub {
    display: flex;
    gap: 18px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .sub-item { font-size: 12px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .sub-item .legend-dot { margin-right: 5px; }
  .sub-item .val { font-weight: 700; color: var(--text); margin-left: 3px; }
  .sub-item .lbl { color: var(--text-dim); }

  /* --- DATE PICKER --- */
  .date-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    padding: 10px 14px;
  }
  .date-row label { font-size: 12px; color: var(--text-dim); font-weight: 500; }
  .date-row input[type="date"] {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-align: right;
    flex: 1;
  }
  .today-btn {
    background: var(--blue-soft);
    border: none;
    color: var(--blue);
    font-size: 11px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 7px;
    cursor: pointer;
  }

  /* --- QUICK ADD --- */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .cards.full { grid-template-columns: 1fr; }

  .qcard {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .qcard-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .qcard-title { font-size: 13px; font-weight: 700; }
  .qcard-price { font-size: 11px; color: var(--text-dim); }

  .qcard-count {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
  }
  .qcard.neu .qcard-count { color: var(--blue); }
  .qcard.bestand .qcard-count { color: var(--green); }

  .qcard-buttons { display: flex; gap: 8px; }

  .btn-round {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 10px 0;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease;
    font-family: 'Inter', sans-serif;
  }
  .btn-round:active { transform: scale(0.93); }

  .qcard.neu .plus { background: var(--blue); color: #fff; }
  .qcard.neu .minus { background: var(--blue-soft); color: var(--blue); }
  .qcard.bestand .plus { background: var(--green); color: #fff; }
  .qcard.bestand .minus { background: var(--green-soft); color: var(--green); }
  .qcard.storno .plus { background: var(--danger); color: #fff; }
  .qcard.storno .minus { background: var(--danger-soft); color: var(--danger); }
  .storno-toggle button.active { background: var(--danger); }

  /* Rate toggle (z.B. Storno-Typ) */
  .rate-toggle {
    display: flex;
    background: var(--toggle-bg);
    border-radius: 7px;
    padding: 2px;
    gap: 2px;
    flex-shrink: 0;
  }
  .rate-toggle button {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 10px;
    min-width: 46px;
    white-space: nowrap;
    border-radius: 5px;
    cursor: pointer;
    color: var(--text-dim);
    transition: background 0.18s ease, color 0.18s ease;
  }
  .rate-toggle button.active {
    background: var(--violet);
    color: white;
  }

  /* --- STATS (Tracker page) --- */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin: 14px 0 20px;
  }
  .stat { padding: 10px 8px; text-align: center; }
  .stat-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .stat-label {
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 3px;
    font-weight: 600;
  }

  /* --- HISTORY TABLE --- */
  .section-title {
    font-size: 13px;
    font-weight: 700;
    margin: 0 0 10px 2px;
    color: var(--text);
  }

  .table-card { padding: 4px 0; overflow: hidden; }
  .table-card.compact thead th, .table-card.compact tbody td { padding-left: 6px; padding-right: 6px; }
  .table-card.compact thead th:first-child, .table-card.compact tbody td:first-child { padding-left: 12px; }
  .table-card.compact thead th:last-child, .table-card.compact tbody td:last-child { padding-right: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-faint);
    font-weight: 700;
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--border);
  }
  thead th.num, td.num { text-align: right; font-family: 'Space Grotesk', sans-serif; }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--row-hover); }

  .dash-payout-list { display: flex; flex-direction: column; gap: 10px; }

    display: flex; justify-content: space-between; align-items: center; gap: 10px;

  }
  .dash-payout-row:last-child { border-bottom: none; }
  .dash-payout-written { font-size: 12px; font-weight: 700; color: var(--text); }
  .dash-payout-due { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  }

  /* --- TEAM-KARTEN (Overhead, nur Teamleiter) --- */

  /* --- HEADER-BUTTONS --- */
  .header-actions { display: flex; align-items: center; gap: 8px; }

  /* --- ONBOARDING / EINSTELLUNGEN --- */
  .ob-overlay {
    position: fixed; inset: 0; z-index: 10000; background: var(--bg);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; justify-content: center; align-items: flex-start;

  .ob-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; }
  .ob-dot { width: 22px; height: 4px; border-radius: 4px; background: var(--border); transition: background 0.2s ease; }
  .ob-dot.done { background: var(--blue); }
  .ob-logo {
    width: 52px; height: 52px; border-radius: 14px; background: var(--blue);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
  }
  .ob-title { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; text-align: center; }
  .ob-sub { font-size: 13px; color: var(--text-dim); text-align: center; margin: 0 0 20px; line-height: 1.45; }
  .ob-field { display: block; margin-bottom: 14px; }
  .ob-field > span { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .ob-field small { display: block; font-size: 11px; color: var(--text-faint); margin-top: 5px; line-height: 1.4; }
  .ob-input {
    width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text);
    font-family: inherit;
  }
  .ob-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .ob-input-wrap { position: relative; }
  .ob-input-wrap .ob-input { padding-right: 38px; }
  .ob-unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-weight: 700; pointer-events: none; }
  .ob-choices { display: grid; gap: 10px; margin-bottom: 8px; }
  .ob-choice {
    text-align: left; border: 1.5px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 14px 16px; cursor: pointer; font-family: inherit;

  .ob-choice b { display: block; font-size: 15px; margin-bottom: 3px; }
  .ob-choice span { font-size: 12px; color: var(--text-dim); line-height: 1.4; }

  .ob-chip {

  }

  .ob-btn:disabled { opacity: 0.4; cursor: default; }

</style>

<body data-theme="light">
<div class="wrap" id="wrap">
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
          <rect x="3" y="3" width="7" height="7" rx="2" fill="#fff"/>
          <rect x="14" y="3" width="7" height="7" rx="2" fill="#fff"/>
          <rect x="3" y="14" width="7" height="7" rx="2" fill="#fff"/>
          <rect x="14" y="14" width="7" height="7" rx="2" fill="#fff"/>
        </svg>
      </div>
      <div>
        <h1>Start (to) count</h1>
        <div class="eyebrow" id="header-eyebrow">Energie Direktvertrieb</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="theme-toggle settings-btn" id="profileBtn" onclick="openProfiles()" title="Profil wechseln">👤</button>
      <button class="theme-toggle settings-btn" id="settingsBtn" onclick="openSettings()" title="Einstellungen">⚙️</button>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Darstellung wechseln">🌙</button>
    </div>
  </header>

  <div class="nav-tabs" id="nav-tabs">
    <div class="toggle-slider" id="nav-slider"></div>
    <button class="nav-tab" id="tab-dashboard" onclick="switchPage('dashboard')">Dashboard</button>
    <button class="nav-tab" id="tab-tracker" onclick="switchPage('tracker')">Tracker</button>
    <button class="nav-tab" id="tab-abrechnungen" onclick="switchPage('abrechnungen')">Meine Abrechnungen</button>
  </div>

  <div class="period-row">
  <div class="card period-toggle-card" id="period-toggle-root" style="display:none;">
    <div class="period-toggle">
      <div class="toggle-slider" id="period-slider"></div>
      <button id="btn-woche" onclick="setStatsPeriod('woche')">Zeitraum</button>
      <button id="btn-monat" onclick="setStatsPeriod('monat')">Monat</button>
      <button id="btn-gesamt" onclick="setStatsPeriod('gesamt')">Jahr</button>
    </div>
  </div>

  <div class="card month-nav-card" id="month-nav-root" style="display:none;">
    <button class="month-nav-arrow" onclick="shiftMonat(1)" title="Vorheriger Monat">‹</button>
    <div class="month-nav-label" id="month-nav-label"></div>
    <button class="month-nav-arrow" id="month-nav-next" onclick="shiftMonat(-1)" title="Nächster Monat">›</button>
  </div>

  <div class="card month-nav-card" id="zeitraum-info-root" style="display:none;">
    <button class="month-nav-arrow" onclick="shiftZeitraum(1)" title="Vorheriger Zeitraum">‹</button>
    <div class="month-nav-label" id="zeitraum-info-label"></div>
    <button class="month-nav-arrow" id="zeitraum-info-next" onclick="shiftZeitraum(-1)" title="Nächster Zeitraum">›</button>
  </div>

  <div class="card month-nav-card" id="jahr-nav-root" style="display:none;">
    <button class="month-nav-arrow" onclick="shiftJahr(1)" title="Vorheriges Jahr">‹</button>
    <div class="month-nav-label" id="jahr-nav-label"></div>
    <button class="month-nav-arrow" id="jahr-nav-next" onclick="shiftJahr(-1)" title="Nächstes Jahr">›</button>
  </div>

  </div>

  <div id="app" class="loading">Lade Daten …</div>
</div>

<script>
const BASE_STORAGE_KEY = 'tagesumsatz-v3';
const PROFILES_KEY = 'tagesumsatz-profiles';
// Profile: nur ein Name, alles bleibt lokal auf diesem Gerät. Das Hauptprofil nutzt den bisherigen Speicherschlüssel,
// damit vorhandene Daten unverändert weiterlaufen.
let profiles = { active: 'main', list: [{ id: 'main', name: 'Mein Profil' }] };
function loadProfiles() {
  try {
    const raw = localStorage.getItem(PROFILES_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.list) && p.list.length && p.list.some(x => x.id === 'main')) {
        profiles = { active: p.list.some(x => x.id === p.active) ? p.active : 'main', list: p.list.filter(x => x && x.id && x.name) };
      }
    }
  } catch (e) { /* Standard: nur Hauptprofil */ }
}
function saveProfiles() {
  try { localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles)); } catch (e) { /* ignorieren */ }
}
function activeProfile() { return profiles.list.find(x => x.id === profiles.active) || profiles.list[0]; }
function storageKeyFor(id) { return id === 'main' ? BASE_STORAGE_KEY : BASE_STORAGE_KEY + '-p-' + id; }
loadProfiles();
let STORAGE_KEY = storageKeyFor(profiles.active);
const LEGACY_KEY = 'tagesumsatz-eintraege-v2';
const THEME_KEY = 'tagesumsatz-theme';
// Provisionen/Steuersatz sind jetzt pro Person einstellbar (Onboarding / Zahnrad im Header).
// applySettings() schreibt die Werte aus `settings` in diese Variablen.
let PREIS_NEUKUNDE = 110;
let PREIS_BESTANDSKUNDE = 15;

let data = {};       // { 'YYYY-MM-DD': {neu, bestand, storno_neu, storno_bestand} }
let events = [];     // [{date:'YYYY-MM-DD', hour:0-23, type:'neu'|'bestand'|'storno_neu'|'storno_bestand'}]
let selectedDate = todayKey();
let stornoType = 'neu'; // 'neu' | 'bestand'
let storageOk = true;
let currentPage = 'dashboard'; // 'dashboard' | 'tracker'
let statsPeriod = 'woche';   // 'woche' | 'monat' | 'gesamt'
let monatOffset = 0;         // Monate zurück ab aktuellem Monat, nur für Dashboard-Monatsnavigation
let zeitraumOffset = 0;      // Abrechnungs-Schreibfenster zurück ab aktuellem Fenster, nur für Dashboard-Zeitraumnavigation
let jahrOffset = 0;          // Jahre zurück ab aktuellem Jahr, nur für Dashboard-Jahresnavigation
let dashboardView = 'brutto'; // 'brutto' (getrackte Schätzung) | 'ausgezahlt' (bestätigt aus Abrechnungen)
let settlementsOpen = false; // Abrechnungen-Karte im Dashboard: eingeklappt (Dropdown) oder ausgeklappt
let settlements = [];        // [{id, label, betrag, auftraege}] - echte Abrechnungen/Auszahlungen
let STEUER_PROZENT = 30;     // % Steuern, die immer automatisch abgezogen (Netto) bzw. auf Fixkosten aufgeschlagen werden
let settings = defaultSettings();

function todayKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function fmtEuro(n) {
  return Math.round(n).toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + ' €';
}

// Für Provisionssätze: zeigt auch Cent-Beträge (12,5 €) statt auf ganze Euro zu runden
function fmtPrice(n) {
  return (Math.round(n * 100) / 100).toLocaleString('de-DE', { maximumFractionDigits: 2 }) + ' €';
}

function fmtDateLabel(key) {
  const d = new Date(key + 'T00:00:00');
  return d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
}

function fmtDateShort(key) {
  const d = new Date(key + 'T00:00:00');
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
}

function blankEntry() {
  return { neu: 0, bestand: 0, storno_neu: 0, storno_bestand: 0, team_neu: 0 };
}

function getEntry(key) {
  if (!data[key]) data[key] = blankEntry();
  const e = data[key];
  if (e.storno_neu === undefined) e.storno_neu = 0;
  if (e.storno_bestand === undefined) e.storno_bestand = 0;
  if (e.team_neu === undefined) e.team_neu = 0;
  return e;
}

function isEntryEmpty(entry) {
  return !entry.neu && !entry.bestand && !entry.storno_neu && !entry.storno_bestand
    && !entry.team_neu;
}

function isTeamleiter() {
  return settings.role === 'teamleiter';
}

// Overhead (nur Teamleiter): Neukunden-Aufträge des Teams × Overhead-Satz.
// Für Bestandskunden gibt es keinen Overhead.
function overheadOf(entry) {
  if (!entry || !isTeamleiter()) return 0;
  return (entry.team_neu || 0) * (settings.overheadNeu || 0);
}

function dayTotal(entry) {
  if (!entry) return 0;
  return entry.neu * PREIS_NEUKUNDE
    + entry.bestand * PREIS_BESTANDSKUNDE
    - (entry.storno_neu || 0) * PREIS_NEUKUNDE
    - (entry.storno_bestand || 0) * PREIS_BESTANDSKUNDE
    + overheadOf(entry);
}

function defaultSettings() {
  return {
    fixkosten: 0,
    fireworksWindow: null,
    onboarded: false,     // wurde der Willkommens-Dialog schon durchlaufen?
    name: '',
    role: 'vertreter',    // 'vertreter' | 'teamleiter'
    preisNeu: 110,        // € Provision pro Neukunde
    preisBestand: 15,     // € Provision pro Bestandskunde
    steuer: 30,           // % Steuern
    ustPflicht: false,    // umsatzsteuerpflichtig? 19 % USt werden mitüberwiesen und müssen ans Finanzamt
    overheadNeu: 0,       // € Overhead pro Neukunden-Auftrag des Teams (nur Teamleiter)
    stornoAufschlag: false, // Ø Storno-Quote der Abrechnungen auf die Fixkosten-Schwelle aufschlagen?
    goalName: '',         // persönliches Finanzziel (z. B. "Rücklage", "Urlaub")
    goalAmount: 0,        // Zielbetrag in € – netto, also das, was wirklich bei dir bleibt
    zielAufrunden: false, // Brutto-Ziel pro Abrechnungsperiode auf volle 10 € aufrunden?
    mineAmount: 0,        // € pro Monat, die nach allen Kosten NUR für mich übrig bleiben sollen (Lebenshaltung/Taschengeld)
    goalPeriod: 'monat',  // 'woche' | 'monat' | 'jahr' | 'custom' – Zeitraum, für den der Zielbetrag gilt
    goalCount: 2,         // nur bei 'custom': Anzahl ...
    goalUnit: 'jahre',    // ... 'wochen' | 'monate' | 'jahre'
    goalStart: ''         // nur bei 'custom': Startdatum (YYYY-MM-DD)
  };
}

function applySettings() {
  const n = Number(settings.preisNeu), b = Number(settings.preisBestand), s = Number(settings.steuer);
  PREIS_NEUKUNDE = isFinite(n) && n >= 0 ? n : 110;
  PREIS_BESTANDSKUNDE = isFinite(b) && b >= 0 ? b : 15;
  STEUER_PROZENT = isFinite(s) && s >= 0 && s < 100 ? s : 30;
}

async function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      data = parsed.days || {};
      events = parsed.events || [];
      settlements = parsed.settlements || [];
      const storedSettings = parsed.settings || {};
      settings = Object.assign(defaultSettings(), storedSettings);
      // Bestehende Nutzer (haben schon Daten, aber das Onboarding noch nie gesehen) sehen den Dialog
      // einmalig ebenfalls – vorausgefüllt mit ihren bisherigen Werten (110 € / 15 € / 30 %).
      applySettings();
      return;
    }
  } catch (e) { /* noch keine v3 Daten vorhanden */ }
  data = {};
  events = [];
  settlements = [];
  settings = defaultSettings();
  if (profiles.active !== 'main') settings.name = activeProfile().name;
  else try {
    const legacy = localStorage.getItem(LEGACY_KEY);
    if (legacy) data = JSON.parse(legacy) || {};
  } catch (e) { /* keine alten Daten vorhanden */ }
  applySettings();
}

async function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ days: data, events: events, settlements: settlements, settings: settings }));
    storageOk = true;
  } catch (e) {
    storageOk = false;
  }
}

async function changeCount(field, delta) {
  const entry = getEntry(selectedDate);
  entry[field] = Math.max(0, entry[field] + delta);
  if (delta > 0) {
    events.push({ date: selectedDate, hour: new Date().getHours(), type: field });
  } else {
    for (let i = events.length - 1; i >= 0; i--) {
      if (events[i].date === selectedDate && events[i].type === field) { events.splice(i, 1); break; }
    }
  }
  if (isEntryEmpty(entry)) delete data[selectedDate];
  await saveData();
  render();
  checkFireworksTrigger();
}

// Team-Aufträge (Overhead, nur Teamleiter). Bewusst ohne `events`, damit die
// Uhrzeit-Auswertung nur die eigenen Verkäufe zählt.
async function changeTeam(field, delta) {
  const entry = getEntry(selectedDate);
  entry[field] = Math.max(0, (entry[field] || 0) + delta);
  if (isEntryEmpty(entry)) delete data[selectedDate];
  await saveData();
  render();
  checkFireworksTrigger();
}

async function changeStorno(delta) {
  const field = stornoType === 'neu' ? 'storno_neu' : 'storno_bestand';
  await changeCount(field, delta);
}

function setStornoType(type) {
  stornoType = type;
  render();
}

async function deleteDay(key) {
  delete data[key];
  events = events.filter(e => e.date !== key);
  await saveData();
  render();
}

function setToday() {
  selectedDate = todayKey();
  render();
}

function switchPage(p) {
  if (currentPage === 'dashboard' && p !== 'dashboard') { monatOffset = 0; zeitraumOffset = 0; jahrOffset = 0; }
  currentPage = p;
  render();
}

function setStatsPeriod(p) {
  statsPeriod = p;
  render();
}

function shiftMonat(delta) {
  monatOffset = Math.max(0, monatOffset + delta);
  render();
}

function shiftZeitraum(delta) {
  zeitraumOffset = Math.max(0, zeitraumOffset + delta);
  render();
}

function shiftJahr(delta) {
  jahrOffset = Math.max(0, jahrOffset + delta);
  render();
}

function windowOffsetBack(n) {
  let win = payoutWindowOf(todayKey());
  for (let i = 0; i < n; i++) {
    const prevDay = new Date(win.schreibStart);
    prevDay.setDate(prevDay.getDate() - 1);
    win = payoutWindowOf(todayKey(prevDay));
  }
  return win;
}

function setDashboardView(v) {
  dashboardView = v;
  render();
}

function toggleSettlements() {
  settlementsOpen = !settlementsOpen;
  render();
}

function nettoOf(brutto) {
  return brutto * (1 - STEUER_PROZENT / 100);
}

// Durchschnittliche Storno-Quote über alle Abrechnungen, in denen Neu-/Bestandskunden-Mengen
// hinterlegt sind: pro Abrechnung Storno / (Neu + Bestand), davon der Mittelwert.
function avgStornoQuote() {
  const quoten = [];
  settlements.forEach(s => {
    const gross = (s.neuMenge || 0) + (s.bestandMenge || 0);
    if (gross > 0) quoten.push(Math.min(1, (s.stornoMenge || 0) / gross));
  });
  if (!quoten.length) return { pct: 0, count: 0 };
  return { pct: (quoten.reduce((a, b) => a + b, 0) / quoten.length) * 100, count: quoten.length };
}

const GOAL_PERIODS = { woche: 'Woche', monat: 'Monat', jahr: 'Jahr', custom: 'Eigener Zeitraum' };
const GOAL_UNITS = { wochen: 'Wochen', monate: 'Monate', jahre: 'Jahre' };
const GOAL_UNIT_MONTHS = { wochen: 12 / 52, monate: 1, jahre: 12 };
function goalPeriodOf(v) { return GOAL_PERIODS[v] ? v : 'monat'; }
function goalChipLabel(k) { return k === 'custom' ? 'Eigener Zeitraum' : 'pro ' + GOAL_PERIODS[k]; }
function goalUnitOf(v) { return GOAL_UNITS[v] ? v : 'jahre'; }
function goalCountOf(v) { const n = Math.round(Number(v)); return n >= 1 && n <= 520 ? n : 1; }
// Gesamtdauer des eigenen Zeitraums in Monaten (Wochen: 52 Wochen ÷ 12 Monate)
function goalCustomMonths(count, unit) { return goalCountOf(count) * GOAL_UNIT_MONTHS[goalUnitOf(unit)]; }
function goalUnitLabel(count, unit) {
  const n = goalCountOf(count), u = goalUnitOf(unit);
  const one = { wochen: 'Woche', monate: 'Monat', jahre: 'Jahr' }[u];
  return n + ' ' + (n === 1 ? one : GOAL_UNITS[u]);
}
function goalEndKey(startKey, count, unit) {
  const [y, m, d] = startKey.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const u = goalUnitOf(unit), n = goalCountOf(count);
  if (u === 'wochen') dt.setDate(dt.getDate() + n * 7);
  else dt.setMonth(dt.getMonth() + (u === 'jahre' ? n * 12 : n));
  return todayKey(dt);
}
// Zielbetrag auf einen Monat umgerechnet (Woche: 52 Wochen ÷ 12 Monate, Jahr: ÷ 12, eigener Zeitraum: ÷ Gesamtmonate)
function goalMonthly(amount, period) {
  if (period === 'woche') return amount * 52 / 12;
  if (period === 'jahr') return amount / 12;
  if (period === 'custom') return amount / goalCustomMonths(settings.goalCount, settings.goalUnit);
  return amount;
}
function goalMonthlyHint(amount, period) {
  if (period === 'jahr') return `${fmtEuro(amount)} ÷ 12`;
  if (period === 'woche') return `${fmtEuro(amount)} × 52 ÷ 12`;
  if (period === 'custom') return `${fmtEuro(amount)} ÷ ${(Math.round(goalCustomMonths(settings.goalCount, settings.goalUnit) * 10) / 10).toLocaleString('de-DE')} Monate`;
  return '';
}
function isoWeekOf(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 86400000 + 1) / 7);
}

function goalCardHtml() {
  const amount = settings.goalAmount || 0;
  const period = goalPeriodOf(settings.goalPeriod);
  const now = new Date();
  const customStart = settings.goalStart || todayKey();
  const periodLabel = period === 'custom' ? goalUnitLabel(settings.goalCount, settings.goalUnit) : period === 'jahr' ? String(now.getFullYear()) : period === 'woche' ? 'KW ' + isoWeekOf(now) : now.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
  const title = settings.goalName ? escapeHtml(settings.goalName) : 'Mein Finanzziel';
  const brutto = goalBruttoFor(period);
  const customEnd = period === 'custom' ? goalEndKey(customStart, settings.goalCount, settings.goalUnit) : '';
  const share = netShare();
  const net = brutto * share;
  const missing = Math.max(0, amount - net);
  const reached = amount > 0 && net >= amount;
  const pct = amount > 0 ? Math.min(100, Math.round(net / amount * 100)) : 0;
  const bruttoNeeded = share > 0 ? missing / share : 0;
  return `
          <div class="card dash-card dash-fix-card">
            <div class="dash-card-head"><div>
              <div class="dash-card-title">🎯 ${title} · ${periodLabel}</div>
              <div class="dash-card-sub">${amount > 0 ? (reached ? 'Ziel erreicht 🎉' : fmtEuro(missing) + ' fehlen noch') : 'Lege in den ⚙️ Einstellungen fest, was am Ende wirklich bei dir bleiben soll'}</div>
            </div></div>
            ${amount > 0 ? `
            <div class="dash-fix-track"><div class="dash-fix-fill ${reached ? 'reached' : ''}" style="width:${pct}%;"></div></div>
            <div class="dash-fix-saldo ${reached ? 'pos' : 'neg'}">${fmtEuro(net)} <span style="font-size:13px;font-weight:600;color:var(--text-dim);">von ${fmtEuro(amount)} · ${pct}%</span></div>
            <div class="dash-fix-sub">${share < 1 ? `Gerechnet mit dem, was wirklich bei dir bleibt (nach ${[stornoAufschlagPct() > 0 ? fmtPct(stornoAufschlagPct()) + ' Storno' : '', STEUER_PROZENT > 0 ? STEUER_PROZENT + '% Steuer' : ''].filter(Boolean).join(' und ')}). ` : ''}${reached ? '' : `Dafür brauchst du noch ca. ${fmtEuro(bruttoNeeded)} Brutto. `}Bisher ${fmtEuro(brutto)} Brutto.</div>` : ''}
          </div>`;
}

function fmtPct(p) {
  return (Math.round(p * 10) / 10).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' %';
}

// Zusätzlicher Aufschlag in %, wenn die Option "Storno-Quote aufschlagen" aktiv ist
function stornoAufschlagPct() {
  return settings.stornoAufschlag ? avgStornoQuote().pct : 0;
}

// Persönliches Ziel (netto) auf einen Abrechnungszeitraum (halber Monat) heruntergerechnet:
// pro Jahr -> /12 = pro Monat, pro Monat -> /2 = pro Zeitraum
function goalPerWindow() {
  const amount = settings.goalAmount || 0;
  if (!(amount > 0)) return 0;
  const monthly = goalMonthly(amount, goalPeriodOf(settings.goalPeriod)); // Woche/Jahr -> pro Monat gegengerechnet
  return monthly / 2; // halber Monat pro Abrechnungszeitraum
}

// Aufbau des Ziels pro Abrechnungszeitraum: (Fixkosten + persönliches Ziel) + Steuer + Storno-Puffer
function zielAufbauCalc(p) {
  const fix = p.fix || 0, goal = p.goal || 0, mine = p.mine || 0;
  const base = fix + goal + mine;
  const withTax = base * (1 + (p.taxPct || 0) / 100);
  const raw = withTax * (1 + (p.stornoPct || 0) / 100);
  const total = p.runden && raw > 0 ? Math.ceil(raw / 10 - 1e-9) * 10 : raw;
  return { fix, goal, mine, base, tax: withTax - base, storno: raw - withTax, raw, round: total - raw, total };
}

function zielAufbau() {
  return zielAufbauCalc({
    fix: settings.fixkosten || 0,
    goal: goalPerWindow(),
    mine: (settings.mineAmount || 0) / 2, // Monatsbetrag -> halber Monat pro Abrechnungszeitraum
    taxPct: STEUER_PROZENT,
    stornoPct: stornoAufschlagPct(),
    runden: !!settings.zielAufrunden,
  });
}

function toggleZielAufrunden(on) {
  settings.zielAufrunden = !!on;
  saveData();
  render();
  checkFireworksTrigger();
}

function fixkostenSchwelle() {
  // Auf die eingetragenen Fixkosten werden automatisch der Steuersatz und – falls aktiviert –
  // die durchschnittliche Storno-Quote aufgeschlagen (nacheinander, jeweils auf den vorherigen Betrag).
  return zielAufbau().total;
}

function toggleStornoAufschlag(on) {
  settings.stornoAufschlag = !!on;
  saveData();
  render();
  checkFireworksTrigger();
}

function currentMonthBruttoLive() {
  // Immer der echte, laufende Kalendermonat - unabhängig von der Dashboard-Monatsnavigation
  return currentMonthDays().reduce((sum, k) => sum + dayTotal(data[k]), 0);
}

// Fixkosten gelten pro Auszahlung, nicht pro Kalendermonat - es gibt ja zwei pro Monat
// (1.-15. und 16.-Monatsende, siehe payoutWindowOf). Diese Funktion summiert nur die
// getrackten Tage innerhalb des aktuell laufenden Schreibfensters.
function currentWindowBruttoLive() {
  const win = payoutWindowOf(todayKey());
  let sum = 0;
  const cur = new Date(win.schreibStart);
  while (cur <= win.schreibEnd) {
    const key = todayKey(cur);
    if (data[key]) sum += dayTotal(data[key]);
    cur.setDate(cur.getDate() + 1);
  }
  return sum;
}

function checkFireworksTrigger() {
  const schwelle = fixkostenSchwelle();
  if (schwelle <= 0) return;
  const win = payoutWindowOf(todayKey());
  const saldo = currentWindowBruttoLive() - schwelle;
  if (saldo >= 0 && settings.fireworksWindow !== win.id) {
    settings.fireworksWindow = win.id;
    saveData();
    playFireworks();
  }
}

function playFireworks() {
  if (typeof document === 'undefined' || !document.body) return;
  const colors = ['#5c6ac4', '#008060', '#9c6ade', '#d72c0d', '#ffc107', '#17c3b2'];
  const overlay = document.createElement('div');
  overlay.className = 'firework-overlay';
  document.body.appendChild(overlay);

  const bursts = 5;
  for (let b = 0; b < bursts; b++) {
    const originX = 15 + Math.random() * 70; // vw
    const originY = 20 + Math.random() * 40; // vh
    const delay = b * 160;
    setTimeout(() => {
      const particles = 22;
      for (let i = 0; i < particles; i++) {
        const el = document.createElement('div');
        el.className = 'firework-particle';
        const angle = (Math.PI * 2 * i) / particles + Math.random() * 0.3;
        const dist = 60 + Math.random() * 90;
        el.style.setProperty('--fx', (Math.cos(angle) * dist) + 'px');
        el.style.setProperty('--fy', (Math.sin(angle) * dist) + 'px');
        el.style.left = originX + 'vw';
        el.style.top = originY + 'vh';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        overlay.appendChild(el);
      }
    }, delay);
  }

  setTimeout(() => {
    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
  }, bursts * 160 + 1400);
}

// ---------- Persönliches Finanzziel ----------
function goalBruttoFor(period) {
  const now = new Date();
  if (period === 'woche') {
    const d = new Date(); const wd = (d.getDay() + 6) % 7; // Montag = 0
    let sum = 0;
    for (let i = 0; i < 7; i++) {
      const k = todayKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() - wd + i));
      if (data[k]) sum += dayTotal(data[k]);
    }
    return sum;
  }
  if (period === 'custom') {
    const start = settings.goalStart || todayKey();
    const end = goalEndKey(start, settings.goalCount, settings.goalUnit);
    return Object.keys(data).reduce((sum, k) => (k >= start && k < end) ? sum + dayTotal(data[k]) : sum, 0);
  }
  const prefix = period === 'jahr' ? String(new Date().getFullYear()) : todayKey().slice(0, 7);
  return Object.keys(data).reduce((sum, k) => k.startsWith(prefix) ? sum + dayTotal(data[k]) : sum, 0);
}

// Wie viel von 1 € Brutto am Ende wirklich bei dir bleibt (nach Storno-Puffer und Steuer)
function netShare() {
  return (1 - stornoAufschlagPct() / 100) * (1 - STEUER_PROZENT / 100);
}

// Speichert Eingaben schon beim Tippen (ohne Neuaufbau der Seite), damit nichts verloren geht
function setGoalLive(field, value) {
  if (field === 'goalAmount') settings.goalAmount = Math.max(0, parseFloat(String(value).replace(',', '.')) || 0);
  saveData();
}

function setGoal(field, value) {
  if (field === 'goalAmount') settings.goalAmount = Math.max(0, parseFloat(String(value).replace(',', '.')) || 0);
  else if (field === 'goalPeriod') {
    settings.goalPeriod = goalPeriodOf(value);
    if (settings.goalPeriod === 'custom' && !settings.goalStart) settings.goalStart = todayKey();
  }
  else if (field === 'goalCount') settings.goalCount = goalCountOf(value);
  else if (field === 'goalUnit') settings.goalUnit = goalUnitOf(value);
  else if (field === 'goalStart') settings.goalStart = /^\d{4}-\d{2}-\d{2}$/.test(value) ? value : todayKey();
  else if (field === 'goalName') settings.goalName = String(value || '').trim().slice(0, 40);
  saveData();
  render();
}

function setMine(v, live) {
  settings.mineAmount = Math.max(0, parseFloat(String(v).replace(',', '.')) || 0);
  saveData();
  if (!live) { render(); checkFireworksTrigger(); }
}

function setFixkosten(v) {
  settings.fixkosten = Math.max(0, parseFloat(v) || 0);
  saveData();
  render();
  checkFireworksTrigger();
}

function addSettlement() {
  const labelEl = document.getElementById('settlementLabel');
  const betragEl = document.getElementById('settlementBetrag');
  const auftrEl = document.getElementById('settlementAuftraege');
  const neuEl = document.getElementById('settlementNeu');
  const bestandEl = document.getElementById('settlementBestand');
  const stornoEl = document.getElementById('settlementStorno');
  const windowEl = document.getElementById('settlementWindow');
  const label = ((labelEl && labelEl.value) || '').trim() || 'Abrechnung';
  const betrag = Math.max(0, parseFloat(betragEl && betragEl.value) || 0);
  const neuMenge = Math.max(0, parseInt(neuEl && neuEl.value, 10) || 0);
  const bestandMenge = Math.max(0, parseInt(bestandEl && bestandEl.value, 10) || 0);
  const stornoMenge = Math.max(0, parseInt(stornoEl && stornoEl.value, 10) || 0);
  // Wenn eine Aufschlüsselung (Neukunden/Bestand/Storno) eingetragen ist, zählt sie als Quelle
  // der Wahrheit für "Aufträge" - sonst greift das klassische manuelle Aufträge-Feld.
  const hasSplit = neuMenge > 0 || bestandMenge > 0 || stornoMenge > 0;
  const manuellAuftraege = Math.max(0, parseInt(auftrEl && auftrEl.value, 10) || 0);
  const auftraege = hasSplit ? Math.max(0, neuMenge + bestandMenge - stornoMenge) : manuellAuftraege;
  const windowId = (windowEl && windowEl.value) || null;
  if (betrag <= 0 && auftraege <= 0) return;
  settlements.push({
    id: Date.now() + '-' + Math.random().toString(36).slice(2),
    label, betrag, auftraege, windowId,
    neuMenge: hasSplit ? neuMenge : null,
    bestandMenge: hasSplit ? bestandMenge : null,
    stornoMenge: hasSplit ? stornoMenge : null,
  });
  saveData();
  render();
}

function deleteSettlement(id) {
  settlements = settlements.filter(s => s.id !== id);
  saveData();
  render();
}

// Summiert alle Abrechnungen zu einer Gesamtübersicht, inkl. Neukunden/Bestand/Storno-Aufschlüsselung
// (soweit vorhanden) - Grundlage für die Ausgezahlt-Ansicht der Kundenmix-/Umsatz-Mix-/Kennzahlen-Karten.
function settlementsAggregate() {
  return settlements.reduce((acc, s) => {
    acc.betrag += s.betrag || 0;
    acc.auftraege += s.auftraege || 0;
    if (s.neuMenge != null || s.bestandMenge != null || s.stornoMenge != null) {
      acc.neu += s.neuMenge || 0;
      acc.bestand += s.bestandMenge || 0;
      acc.storno += s.stornoMenge || 0;
      acc.hasSplit = true;
    }
    return acc;
  }, { betrag: 0, auftraege: 0, neu: 0, bestand: 0, storno: 0, hasSplit: false });
}

const PDFJS_VERSION = '3.11.174';

function ensurePdfJsLoaded() {
  if (window.pdfjsLib) return Promise.resolve();
  if (window.__pdfjsLoadingPromise) return window.__pdfjsLoadingPromise;
  window.__pdfjsLoadingPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VERSION}/build/pdf.min.js`;
    script.onload = () => {
      try {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VERSION}/build/pdf.worker.min.js`;
        resolve();
      } catch (e) { reject(e); }
    };
    script.onerror = () => reject(new Error('PDF-Bibliothek konnte nicht geladen werden (Internetverbindung nötig).'));
    document.head.appendChild(script);
  });
  return window.__pdfjsLoadingPromise;
}

// Deutsches Zahlenformat, mit oder ohne Tausenderpunkt, mit optionalem führenden Minus.
// Kein €/EUR-Zeichen nötig - viele Abrechnungen (z.B. Gutschriften) haben das € nur in der Spaltenüberschrift.
const AMOUNT_PATTERN = '(-?\\d{1,3}(?:\\.\\d{3})*,\\d{2})';

function parseEuroToNumber(str) {
  let s = String(str).trim();
  const neg = /^-/.test(s);
  s = s.replace(/[^0-9.,]/g, '');
  if (s.includes(',') && s.includes('.')) {
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (s.includes(',')) {
    s = s.replace(',', '.');
  }
  const n = parseFloat(s);
  if (isNaN(n)) return null;
  return neg ? -Math.abs(n) : n;
}

function findAmountNear(text, keywords) {
  for (const kw of keywords) {
    const re = new RegExp(kw + '[\\s\\S]{0,40}?' + AMOUNT_PATTERN, 'i');
    const m = text.match(re);
    if (m) {
      const val = parseEuroToNumber(m[1]);
      if (val != null) return val;
    }
  }
  return null;
}

function findMengeNear(text, keywords) {
  for (const kw of keywords) {
    const re = new RegExp(kw + '[\\s\\S]{0,60}?(\\d{1,4})\\s*(?:Stück|Stk\\.?)', 'i');
    const m = text.match(re);
    if (m) return parseInt(m[1], 10);
  }
  return null;
}

function parseAbrechnungText(text) {
  // 1. Betrag: zuerst nach typischen "Endsumme"-Begriffen suchen (ohne €-Pflicht),
  //    Priorität: Gesamtbetrag > Auszahlungsbetrag/-Auszahlung > Zwischensumme als Rückfall.
  let betrag = findAmountNear(text, [
    'gesamtbetrag',
    'auszahlungsbetrag',
    'gesamtauszahlung',
    'netto[-\\s]?auszahlung',
    'überweisungsbetrag',
    'zu zahlender betrag',
    'zwischensumme\\s*\\(netto\\)',
    'zwischensumme',
    'gesamtsumme',
  ]);
  if (betrag == null) {
    // Letzter Rückfall: größter im Dokument gefundener Betrag (mit oder ohne € davor/danach)
    const allAmounts = [];
    const re = new RegExp(AMOUNT_PATTERN, 'g');
    let m;
    while ((m = re.exec(text)) !== null) {
      const v = parseEuroToNumber(m[1]);
      if (v != null && v > 0) allAmounts.push(v);
    }
    if (allAmounts.length) betrag = Math.max(...allAmounts);
  }

  // 2. Aufträge: typische Zeilen von Energie-Direktvertrieb-Abrechnungen
  //    ("Vermittlung Neukunde ... 20 Stück", "Tarifoptimierung Bestandskunde ... 38 Stück",
  //     "Storno ... 3 Stück") werden erkannt und zu einer bestätigten Netto-Anzahl verrechnet.
  const neuMenge = findMengeNear(text, ['Vermittlung\\s+Neukunde', 'Neukunde']);
  const bestandMenge = findMengeNear(text, ['Tarifoptimierung\\s+Bestandskunde', 'Bestandskunde']);
  const stornoMenge = findMengeNear(text, ['Storno']);

  let auftraege = null;
  if (neuMenge != null || bestandMenge != null) {
    auftraege = Math.max(0, (neuMenge || 0) + (bestandMenge || 0) - (stornoMenge || 0));
  } else {
    // Generischer Rückfall für andere Abrechnungs-Layouts
    const countMatch = text.match(/(\d{1,4})\s?(?:aufträge|auftrag|verträge|vertrag|abschlüsse|abschluss|stück)/i);
    if (countMatch) auftraege = parseInt(countMatch[1], 10);
  }

  // 3. Zeitraum/Label: "Leistungszeitraum: September 2026 - Teil 2" direkt übernehmen,
  //    sonst Monatsname+Jahr, sonst ein Datum im Dokument.
  let label = null;
  const lzMatch = text.match(/Leistungszeitraum:?\s*([^\n]{3,45}?)(?=\s{2,}|RE-Korrekturnr|Rechnungsnr|Kundennr|Datum:|$)/i);
  if (lzMatch) {
    label = lzMatch[1].trim();
  } else {
    const monthNames = ['januar', 'februar', 'märz', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'dezember'];
    const monthRegex = new RegExp('(' + monthNames.join('|') + ')\\s+(\\d{4})(\\s*-\\s*Teil\\s*\\d)?', 'i');
    const monthMatch = text.match(monthRegex);
    if (monthMatch) {
      label = monthMatch[1].charAt(0).toUpperCase() + monthMatch[1].slice(1).toLowerCase() + ' ' + monthMatch[2] + (monthMatch[3] || '');
    } else {
      const dateMatch = text.match(/(\d{2})\.(\d{2})\.(\d{4})/);
      if (dateMatch) label = dateMatch[0];
    }
  }

  return { label, betrag, auftraege, neuMenge, bestandMenge, stornoMenge };
}

// Erkennt aus einem Abrechnungstext (z.B. "... September 2026 - Teil 2 ...") das passende
// Auszahlungs-Fenster (siehe payoutWindowOf) anhand von Monat + Jahr + "Teil 1"/"Teil 2".
function detectWindowIdFromText(text) {
  const monthNames = ['januar', 'februar', 'märz', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'dezember'];
  const re = new RegExp('(' + monthNames.join('|') + ')\\s+(\\d{4})\\s*-\\s*teil\\s*(\\d)', 'i');
  const m = text.match(re);
  if (!m) return null;
  const monthIdx = monthNames.indexOf(m[1].toLowerCase());
  if (monthIdx < 0) return null;
  const year = parseInt(m[2], 10);
  const suffix = m[3] === '1' ? 'A' : 'B';
  return `${year}-${String(monthIdx + 1).padStart(2, '0')}-${suffix}`;
}

async function extractPdfText(file) {
  await ensurePdfJsLoaded();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  let fullText = '';
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    fullText += content.items.map(it => it.str).join(' ') + '\n';
  }
  return fullText;
}

// Status-Text der letzten Sammel-Einlesung (bleibt nach dem Neuzeichnen sichtbar)
let bulkUploadStatus = '';

async function handlePdfUpload(event) {
  const files = Array.from((event.target.files) || []);
  const statusEl = document.getElementById('pdfUploadStatus');
  if (!files.length) return;
  if (files.length > 1) { await handleBulkPdfUpload(files, statusEl); event.target.value = ''; return; }
  const file = files[0];
  if (statusEl) statusEl.textContent = 'Lese PDF …';
  try {
    const fullText = await extractPdfText(file);
    const parsed = parseAbrechnungText(fullText);
    const windowId = detectWindowIdFromText(fullText);
    const labelEl = document.getElementById('settlementLabel');
    const betragEl = document.getElementById('settlementBetrag');
    const auftrEl = document.getElementById('settlementAuftraege');
    const neuEl = document.getElementById('settlementNeu');
    const bestandEl = document.getElementById('settlementBestand');
    const stornoEl = document.getElementById('settlementStorno');
    const windowEl = document.getElementById('settlementWindow');
    if (labelEl && parsed.label) labelEl.value = parsed.label;
    if (betragEl && parsed.betrag != null) betragEl.value = parsed.betrag;
    if (auftrEl && parsed.auftraege != null) auftrEl.value = parsed.auftraege;
    if (neuEl && parsed.neuMenge != null) neuEl.value = parsed.neuMenge;
    if (bestandEl && parsed.bestandMenge != null) bestandEl.value = parsed.bestandMenge;
    if (stornoEl && parsed.stornoMenge != null) stornoEl.value = parsed.stornoMenge;
    let windowMatched = false;
    if (windowEl && windowId && windowEl.options) {
      for (let i = 0; i < windowEl.options.length; i++) {
        if (windowEl.options[i].value === windowId) { windowEl.value = windowId; windowMatched = true; break; }
      }
    }
    if (statusEl) {
      const splitInfo = (parsed.neuMenge != null || parsed.bestandMenge != null)
        ? ` (${parsed.neuMenge || 0} NK / ${parsed.bestandMenge || 0} Bestand${parsed.stornoMenge ? ' / ' + parsed.stornoMenge + ' Storno' : ''})`
        : '';
      statusEl.textContent = parsed.betrag != null
        ? `Erkannt: ${parsed.betrag} €${parsed.auftraege != null ? ' · ' + parsed.auftraege + ' Aufträge' + splitInfo : ''}${windowMatched ? ' · Zeitfenster zugeordnet' : ''} – bitte kurz prüfen, dann "Hinzufügen".`
        : 'Konnte keinen Betrag automatisch erkennen – bitte Werte manuell eintragen.';
    }
  } catch (e) {
    if (statusEl) statusEl.textContent = 'PDF konnte nicht gelesen werden: ' + (e && e.message ? e.message : 'Unbekannter Fehler');
  } finally {
    event.target.value = '';
  }
}

// Mehrere Abrechnungs-PDFs auf einmal: jede wird ausgelesen und direkt hinzugefügt.
// Bereits vorhandene (gleiches Zeitfenster/Label + gleicher Betrag) werden übersprungen.
async function handleBulkPdfUpload(files, statusEl) {
  const added = [], skipped = [], failed = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (statusEl) statusEl.textContent = `Lese PDF ${i + 1} von ${files.length} …`;
    try {
      const text = await extractPdfText(f);
      const parsed = parseAbrechnungText(text);
      if (parsed.betrag == null && parsed.auftraege == null) { failed.push(f.name); continue; }
      const windowId = detectWindowIdFromText(text);
      const label = parsed.label || (f.name || 'Abrechnung').replace(/\.pdf$/i, '');
      const betrag = parsed.betrag != null ? Math.max(0, parsed.betrag) : 0;
      const hasSplit = parsed.neuMenge != null || parsed.bestandMenge != null;
      const dup = settlements.some(x => x.label === label && Math.abs((x.betrag || 0) - betrag) < 0.005 && (!windowId || x.windowId === windowId || !x.windowId));
      if (dup) { skipped.push(label); continue; }
      const auftraege = parsed.auftraege != null ? parsed.auftraege : 0;
      settlements.push({
        id: Date.now() + '-' + Math.random().toString(36).slice(2),
        label, betrag, auftraege, windowId,
        neuMenge: hasSplit ? (parsed.neuMenge || 0) : null,
        bestandMenge: hasSplit ? (parsed.bestandMenge || 0) : null,
        stornoMenge: hasSplit ? (parsed.stornoMenge || 0) : null,
      });
      added.push(label);
    } catch (e) {
      failed.push(f.name);
    }
  }
  if (added.length) saveData();
  bulkUploadStatus = `✅ ${added.length} Abrechnung${added.length === 1 ? '' : 'en'} hinzugefügt`
    + (skipped.length ? ` · ${skipped.length} schon vorhanden (übersprungen)` : '')
    + (failed.length ? ` · ⚠️ nicht lesbar: ${failed.join(', ')}` : '')
    + (added.length ? ' – bitte unten kurz prüfen.' : '');
  render();
}

function weekKeyOf(key) {
  const d = new Date(key + 'T00:00:00');
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return todayKey(d);
}

function prevDayKey(key) {
  const d = new Date(key + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  return todayKey(d);
}

function lastNDays(n, endDate) {
  const arr = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(endDate);
    d.setDate(d.getDate() - i);
    arr.push(todayKey(d));
  }
  return arr;
}

// Alle Tages-Keys zwischen startDate und endDate (inklusive) - z.B. für ein Abrechnungs-Schreibfenster.
function daysInRange(startDate, endDate) {
  const arr = [];
  const cur = new Date(startDate);
  while (cur <= endDate) {
    arr.push(todayKey(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return arr;
}

function currentMonthDays() {
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const first = new Date(year, month, 1);
  const todayStr = todayKey(now);
  const arr = [];
  let d = new Date(first);
  while (d.getMonth() === month) {
    const key = todayKey(d);
    arr.push(key);
    if (key === todayStr) break;
    d.setDate(d.getDate() + 1);
  }
  return arr;
}

function monthDaysForOffset(offset) {
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() - offset, 1);
  const year = base.getFullYear(), month = base.getMonth();
  const todayStr = todayKey(now);
  const arr = [];
  let d = new Date(year, month, 1);
  while (d.getMonth() === month) {
    const key = todayKey(d);
    if (offset === 0 && key > todayStr) break; // aktueller Monat: nicht in die Zukunft
    arr.push(key);
    d.setDate(d.getDate() + 1);
  }
  return arr;
}

function monthOffsetLabel(offset) {
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() - offset, 1);
  return base.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
}

function zeitraumOffsetLabel(offset) {
  const win = windowOffsetBack(offset);
  return 'Abrechnungszeitraum: ' + fmtWindowRange(win.schreibStart, win.schreibEnd) + ' ' + win.schreibStart.getFullYear();
}

function jahrOffsetLabel(offset) {
  return String(new Date().getFullYear() - offset);
}

function allMonthsAgg() {
  const keys = Object.keys(data).sort();
  const map = {};
  keys.forEach(k => {
    const mk = k.slice(0, 7);
    map[mk] = (map[mk] || 0) + dayTotal(data[k]);
  });
  const sortedMonths = Object.keys(map).sort();
  const labels = sortedMonths.map(m => new Date(m + '-01T00:00:00').toLocaleDateString('de-DE', { month: 'short', year: '2-digit' }));
  const values = sortedMonths.map(m => map[m]);
  return { labels, values };
}

function entryCount(entry) {
  if (!entry) return 0;
  return (entry.neu || 0) + (entry.bestand || 0);
}

function allMonthsEntriesAgg() {
  const keys = Object.keys(data).sort();
  const map = {};
  keys.forEach(k => {
    const mk = k.slice(0, 7);
    map[mk] = (map[mk] || 0) + entryCount(data[k]);
  });
  const sortedMonths = Object.keys(map).sort();
  return sortedMonths.map(m => map[m]);
}

function bestandRevenue(entry) {
  if (!entry) return 0;
  return (entry.bestand || 0) * PREIS_BESTANDSKUNDE;
}

function allMonthsBestandAgg() {
  const keys = Object.keys(data).sort();
  const map = {};
  keys.forEach(k => {
    const mk = k.slice(0, 7);
    map[mk] = (map[mk] || 0) + bestandRevenue(data[k]);
  });
  const sortedMonths = Object.keys(map).sort();
  return sortedMonths.map(m => map[m]);
}

function neuRevenue(entry) {
  if (!entry) return 0;
  return (entry.neu || 0) * PREIS_NEUKUNDE;
}

function allMonthsNeuAgg() {
  const keys = Object.keys(data).sort();
  const map = {};
  keys.forEach(k => {
    const mk = k.slice(0, 7);
    map[mk] = (map[mk] || 0) + neuRevenue(data[k]);
  });
  const sortedMonths = Object.keys(map).sort();
  return sortedMonths.map(m => map[m]);
}

function stornoLossOf(entry) {
  if (!entry) return 0;
  return (entry.storno_neu || 0) * PREIS_NEUKUNDE + (entry.storno_bestand || 0) * PREIS_BESTANDSKUNDE;
}

function allMonthsStornoAgg() {
  const keys = Object.keys(data).sort();
  const map = {};
  keys.forEach(k => {
    const mk = k.slice(0, 7);
    map[mk] = (map[mk] || 0) + stornoLossOf(data[k]);
  });
  const sortedMonths = Object.keys(map).sort();
  return sortedMonths.map(m => map[m]);
}

function getPeriodDates() {
  // 'woche' zeigt jetzt den aktuellen Abrechnungszeitraum (1.-15. bzw. 16.-Monatsende)
  // statt einer starren 7-Tage-Woche, da Auftraggeber/Abrechnung so takten.
  if (statsPeriod === 'woche') {
    const win = windowOffsetBack(currentPage === 'dashboard' ? zeitraumOffset : 0);
    return daysInRange(win.schreibStart, win.schreibEnd);
  }
  if (statsPeriod === 'monat') return monthDaysForOffset(currentPage === 'dashboard' ? monatOffset : 0);
  // 'gesamt' = ausgewähltes Kalenderjahr (Standard: aktuelles Jahr)
  const year = String(new Date().getFullYear() - (currentPage === 'dashboard' ? jahrOffset : 0));
  return Object.keys(data).filter(k => k.startsWith(year)).sort();
}

function hourCounts(periodDates) {
  const counts = new Array(24).fill(0);
  const set = periodDates ? new Set(periodDates) : null;
  events.forEach(e => {
    if (!set || set.has(e.date)) counts[e.hour]++;
  });
  return counts;
}

function computeHighlights(periodDates, hCounts) {
  let bestDay = null, bestVal = -1;
  periodDates.forEach(k => {
    const t = dayTotal(data[k]);
    if (t > bestVal) { bestVal = t; bestDay = k; }
  });
  let bestHour = 0, bestHourVal = -1;
  hCounts.forEach((c, h) => { if (c > bestHourVal) { bestHourVal = c; bestHour = h; } });
  let customerCount = 0;
  periodDates.forEach(k => {
    const e = data[k];
    if (e) customerCount += (e.neu || 0) + (e.bestand || 0);
  });
  return { bestDay, bestVal, bestHour, bestHourVal, customerCount };
}

function computeStreak() {
  let streak = 0;
  let d = new Date();
  while (true) {
    const key = todayKey(d);
    const t = dayTotal(data[key]);
    if (t > 0) { streak++; d.setDate(d.getDate() - 1); } else break;
  }
  return streak;
}

function breakdown(periodDates) {
  let neu = 0, bestand = 0, overhead = 0;
  periodDates.forEach(k => {
    const e = data[k];
    if (!e) return;
    neu += (e.neu || 0) * PREIS_NEUKUNDE;
    bestand += (e.bestand || 0) * PREIS_BESTANDSKUNDE;
    overhead += overheadOf(e);
  });
  const total = neu + bestand + overhead;
  const items = [
    { label: 'Neukunden', value: neu, color: 'var(--blue)' },
    { label: 'Bestandskunden', value: bestand, color: 'var(--green)' }
  ];
  // Für Teamleiter immer anzeigen (auch bei 0 %), damit klar ist, wie viel des Umsatzes Overhead ist
  if (isTeamleiter()) items.push({ label: 'Overhead (Team)', value: overhead, color: 'var(--violet)', isOverhead: true });
  return items.sort((a, b) => b.value - a.value)
   .map(c => ({ ...c, pct: total ? Math.round((c.value / total) * 100) : 0 }));
}

function hexToRgba(hex, alpha) {
  hex = hex.trim().replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const r = parseInt(hex.substring(0, 2), 16), g = parseInt(hex.substring(2, 4), 16), b = parseInt(hex.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function buildStatsData() {
  const periodDates = getPeriodDates();
  let chartLabels, chartValues, entryValues, bestandValues, neuValues, stornoValues;
  if (statsPeriod === 'gesamt') {
    const agg = allMonthsAgg();
    chartLabels = agg.labels; chartValues = agg.values;
    entryValues = allMonthsEntriesAgg();
    bestandValues = allMonthsBestandAgg();
    neuValues = allMonthsNeuAgg();
    stornoValues = allMonthsStornoAgg();
  } else if (statsPeriod === 'woche') {
    chartLabels = periodDates.map(k => new Date(k + 'T00:00:00').toLocaleDateString('de-DE', { weekday: 'short' }));
    chartValues = periodDates.map(k => dayTotal(data[k]));
    entryValues = periodDates.map(k => entryCount(data[k]));
    bestandValues = periodDates.map(k => bestandRevenue(data[k]));
    neuValues = periodDates.map(k => neuRevenue(data[k]));
    stornoValues = periodDates.map(k => stornoLossOf(data[k]));
  } else {
    chartLabels = periodDates.map(k => String(parseInt(k.slice(8, 10), 10)));
    chartValues = periodDates.map(k => dayTotal(data[k]));
    entryValues = periodDates.map(k => entryCount(data[k]));
    bestandValues = periodDates.map(k => bestandRevenue(data[k]));
    neuValues = periodDates.map(k => neuRevenue(data[k]));
    stornoValues = periodDates.map(k => stornoLossOf(data[k]));
  }
  // 'gesamt' ist jetzt das aktuelle Jahr (nicht mehr wirklich alles), also immer auf periodDates einschränken
  const hCounts = hourCounts(periodDates);
  const hLabels = Array.from({ length: 24 }, (_, h) => h + 'h');
  const hi = computeHighlights(periodDates, hCounts);
  const streak = computeStreak();
  const bd = breakdown(periodDates);
  const periodTotal = chartValues.reduce((a, b) => a + b, 0);
  const entriesTotal = entryValues.reduce((a, b) => a + b, 0);
  const bestandTotal = bestandValues.reduce((a, b) => a + b, 0);
  const neuTotal = neuValues.reduce((a, b) => a + b, 0);

  let neuCount = 0, bestandCount = 0, stornoNeuCount = 0, stornoBestandCount = 0;
  periodDates.forEach(k => {
    const e = data[k];
    if (!e) return;
    neuCount += e.neu || 0;
    bestandCount += e.bestand || 0;
    stornoNeuCount += e.storno_neu || 0;
    stornoBestandCount += e.storno_bestand || 0;
  });
  const stornoCount = stornoNeuCount + stornoBestandCount;
  const stornoLoss = stornoNeuCount * PREIS_NEUKUNDE + stornoBestandCount * PREIS_BESTANDSKUNDE;
  const neuStornoQuote = neuCount > 0 ? Math.round((stornoNeuCount / neuCount) * 100) : 0;
  const bestandStornoQuote = bestandCount > 0 ? Math.round((stornoBestandCount / bestandCount) * 100) : 0;
  const neuStornoRatio = stornoNeuCount > 0 ? Math.round(neuCount / stornoNeuCount) : 0;
  const bestandStornoRatio = stornoBestandCount > 0 ? Math.round(bestandCount / stornoBestandCount) : 0;

  return {
    periodDates, chartLabels, chartValues, entryValues, bestandValues, neuValues, stornoValues, hCounts, hLabels,
    hi, streak, bd, periodTotal, entriesTotal, bestandTotal, neuTotal,
    neuCount, bestandCount, stornoNeuCount, stornoBestandCount, stornoCount, stornoLoss,
    neuStornoQuote, bestandStornoQuote, neuStornoRatio, bestandStornoRatio
  };
}

  const stornoCount = (entry.storno_neu || 0) + (entry.storno_bestand || 0);

  const prevTotal = dayTotal(data[prevDayKey(selectedDate)]);

    const t = dayTotal(data[k]);
    allTotal += t;

    if (weekKeyOf(k) === weekKey) weekTotal += t;

        ${overheadRevenue > 0 ? `<span class="sub-item"><span class="legend-dot" style="background:var(--violet)"></span><span class="lbl">Overhead</span><span class="val">${fmtEuro(overheadRevenue)}</span></span>` : ''}
        ${stornoCount > 0 ? `<span class="sub-item"><span class="legend-dot" style="background:var(--danger)"></span><span class="lbl">Storno</span><span class="val" style="color:var(--danger);">−${fmtEuro(stornoLoss)}</span></span>` : ''}

function getThemeColors() {
  const styles = getComputedStyle(document.body);
  const get = (v, fallback) => (styles.getPropertyValue(v).trim() || fallback);
  return {
    blue: get('--blue', '#5c6ac4'),
    green: get('--green', '#008060'),
    violet: get('--violet', '#9c6ade'),
    danger: get('--danger', '#d72c0d'),
    border: get('--border', '#e3e4e6'),
    textDim: get('--text-dim', '#6d7175'),
    textFaint: get('--text-faint', '#9a9ea1')
  };
}


function previousPeriodDates() {
  if (statsPeriod === 'woche') {
    // Vorperiode = das vorherige Abrechnungs-Schreibfenster
    const offset = (currentPage === 'dashboard' ? zeitraumOffset : 0) + 1;
    const prevWin = windowOffsetBack(offset);
    return daysInRange(prevWin.schreibStart, prevWin.schreibEnd);
  }
  if (statsPeriod === 'monat') {
    const offset = (currentPage === 'dashboard' ? monatOffset : 0) + 1;
    const now = new Date();
    const prevMonth = new Date(now.getFullYear(), now.getMonth() - offset, 1);
    const month = prevMonth.getMonth();
    const arr = [];
    let d = new Date(prevMonth);
    while (d.getMonth() === month) {
      arr.push(todayKey(d));
      d.setDate(d.getDate() + 1);
    }
    return arr;
  }
  // 'gesamt' = ausgewähltes Jahr -> Vorperiode ist das Jahr davor
  const year = new Date().getFullYear() - (currentPage === 'dashboard' ? jahrOffset : 0) - 1;
  return Object.keys(data).filter(k => k.startsWith(String(year))).sort();
}

// Auszahlungs-Rhythmus: 1.-15. geschrieben -> Auszahlung 20.-25. im selben Monat
//                        16.-Monatsende geschrieben -> Auszahlung 7.-12. im Folgemonat
function payoutWindowOf(key) {
  const d = new Date(key + 'T00:00:00');
  const year = d.getFullYear(), month = d.getMonth(), day = d.getDate();
  if (day <= 15) {
    return {
      id: `${year}-${String(month + 1).padStart(2, '0')}-A`,
      schreibStart: new Date(year, month, 1),
      schreibEnd: new Date(year, month, 15),
      auszahlStart: new Date(year, month, 20),
      auszahlEnd: new Date(year, month, 25),
    };
  }
  const lastDay = new Date(year, month + 1, 0).getDate();
  const payoutBase = new Date(year, month + 1, 1);
  return {
    id: `${year}-${String(month + 1).padStart(2, '0')}-B`,
    schreibStart: new Date(year, month, 16),
    schreibEnd: new Date(year, month, lastDay),
    auszahlStart: new Date(payoutBase.getFullYear(), payoutBase.getMonth(), 7),
    auszahlEnd: new Date(payoutBase.getFullYear(), payoutBase.getMonth(), 12),
  };
}

function payoutStatus(win) {
  const now = new Date();
  if (now <= win.schreibEnd) return 'offen';
  if (now < win.auszahlStart) return 'erwartet';
  if (now <= win.auszahlEnd) return 'faellig';
  return 'ueberfaellig';
}

const PAYOUT_STATUS_LABELS = {
  offen: { text: 'Läuft noch', color: 'var(--text-dim)' },
  erwartet: { text: 'Auszahlung erwartet', color: 'var(--blue)' },
  faellig: { text: 'Jetzt fällig', color: 'var(--green)' },
  ueberfaellig: { text: 'Fenster vorbei', color: 'var(--danger)' },
};

function fmtWindowRange(start, end) {
  const monthFmt = (d) => d.toLocaleDateString('de-DE', { month: 'short' });
  if (start.getMonth() === end.getMonth()) {
    return `${start.getDate()}.–${end.getDate()}. ${monthFmt(end)}`;
  }
  return `${start.getDate()}. ${monthFmt(start)} – ${end.getDate()}. ${monthFmt(end)}`;
}

function buildPayoutWindows(daysBack = 70, limit = 4) {
  const now = new Date();
  const map = {};
  for (let i = 0; i < daysBack; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const key = todayKey(d);
    const win = payoutWindowOf(key);
    if (!map[win.id]) map[win.id] = Object.assign({ brutto: 0, count: 0 }, win);
    const e = data[key];
    if (e) {
      map[win.id].brutto += dayTotal(e);
      map[win.id].count += (e.neu || 0) + (e.bestand || 0);
    }
  }
  return Object.values(map)
    .sort((a, b) => b.schreibStart - a.schreibStart)
    .slice(0, limit);
}

function monthlyHistoryData(months = 6) {
  const now = new Date();
  const result = [];
  for (let i = months - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const monthIdx = d.getMonth();
    const year = d.getFullYear();
    let total = 0, neu = 0, bestand = 0, storno = 0;
    let cur = new Date(year, monthIdx, 1);
    while (cur.getMonth() === monthIdx) {
      const key = todayKey(cur);
      const e = data[key];
      if (e) {
        total += dayTotal(e);
        neu += e.neu || 0;
        bestand += e.bestand || 0;
        storno += (e.storno_neu || 0) + (e.storno_bestand || 0);
      }
      cur.setDate(cur.getDate() + 1);
    }
    const label = d.toLocaleDateString('de-DE', { month: 'short', year: '2-digit' });
    const isCurrent = i === 0;
    result.push({ label, total, neu, bestand, storno, isCurrent });
  }
  return result;
}

// Wie monthlyHistoryData, aber auf Basis bestätigter Abrechnungen (über deren windowId
// dem jeweiligen Monat zugeordnet) statt getrackter Tageswerte - für die Ausgezahlt-Ansicht.
function monthlySettlementData(months = 6) {
  const now = new Date();
  const result = [];
  for (let i = months - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const monthKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const total = settlements
      .filter(s => s.windowId && s.windowId.startsWith(monthKey))
      .reduce((sum, s) => sum + (s.betrag || 0), 0);
    const label = d.toLocaleDateString('de-DE', { month: 'short', year: '2-digit' });
    result.push({ label, total, isCurrent: i === 0 });
  }
  return result;
}

function buildDonutChartSVG(segments, opts) {
  const o = Object.assign({ size: 200, strokeWidth: 24, track: 'var(--border)' }, opts || {});
  const r = (o.size - o.strokeWidth) / 2;
  const cx = o.size / 2, cy = o.size / 2;
  const circumference = 2 * Math.PI * r;
  const total = segments.reduce((a, s) => a + s.value, 0);
  let offsetAcc = 0;
  const gap = total > 0 ? Math.min(3, circumference * 0.01) : 0;
  const arcs = segments.filter(s => s.value > 0).map(s => {
    const frac = s.value / total;
    const len = Math.max(0, frac * circumference - gap);
    const dasharray = `${len.toFixed(2)} ${(circumference - len).toFixed(2)}`;
    const dashoffset = (-offsetAcc).toFixed(2);
    offsetAcc += frac * circumference;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${o.strokeWidth}" stroke-dasharray="${dasharray}" stroke-dashoffset="${dashoffset}" stroke-linecap="round" class="donut-arc"/>`;
  }).join('');
  return `
    <svg viewBox="0 0 ${o.size} ${o.size}" width="${o.size}" height="${o.size}" class="donut-svg">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${o.track}" stroke-width="${o.strokeWidth}"/>
      <g transform="rotate(-90 ${cx} ${cy})">${arcs}</g>
    </svg>`;
}
